gn, -0.12, 0.22); fMesh.rotation.x = -0.9; fMesh.rotation.z = -0.35 * mirrorSign;\n        fretArm.add(fMesh); upperPivot.add(fretArm);\n\n        const nameTag = makeSpriteLabel(nameText, tagBg, 0.88); nameTag.position.set(0, 2.34, 0); animGroup.add(nameTag);\n        const tickBadge = makeResultBadgeSprite(true); tickBadge.position.set(0, 3.24, 0); tickBadge.visible = false; animGroup.add(tickBadge);\n        const crossBadge = makeResultBadgeSprite(false); crossBadge.position.set(0, 3.24, 0); crossBadge.visible = false; animGroup.add(crossBadge);\n\n        const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.56, 24), new THREE.MeshBasicMaterial({ color: dressCol, side: THREE.DoubleSide, transparent: true, opacity: 0.78 }));\n        ring.rotation.x = -Math.PI / 2; ring.position.y = 0.035; root.add(ring);\n\n        if (draggableId > 0) {\n          const hit = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 2.5, 12), new THREE.MeshBasicMaterial({ visible: false }));\n          hit.position.y = 1.2; hit.userData = { draggableId }; root.add(hit);\n          root.userData.hitMesh = hit;\n        }\n        Object.assign(root.userData, { kind: 'guitar', mirrorSign, animGroup, upperPivot, headGroup, strumArm, nameTag, tickBadge, crossBadge });\n        return root;\n      }\n\n      function createDancer(nameText, tagBg, outfitCol, accentCol, mirrorSign, draggableId) {\n        const root = new THREE.Group(), animGroup = new THREE.Group();\n        root.add(animGroup);\n        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd5b8, roughness: 0.6 });\n        const outfitMat = new THREE.MeshStandardMaterial({ color: outfitCol, roughness: 0.48 });\n        const accentMat = new THREE.MeshStandardMaterial({ color: accentCol, roughness: 0.45 });\n        const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.65 });\n        const hairMat = new THREE.MeshStandardMaterial({ color: 0x1e1b18, roughness: 0.78 });\n\n        function makeLeg(side) {\n          const hip = new THREE.Group(); hip.position.set(side * 0.17, 0.68, 0);\n          const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.088, 0.078, 0.34, 10), pantsMat);\n          thigh.position.y = -0.17; hip.add(thigh);\n          const knee = new THREE.Group(); knee.position.set(0, -0.34, 0);\n          const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.065, 0.32, 10), pantsMat);\n          shin.position.y = -0.16; knee.add(shin);\n          const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.1, 0.26), new THREE.MeshStandardMaterial({ color: 0xffffff }));\n          shoe.position.set(0, -0.32, 0.05); knee.add(shoe);\n          hip.add(knee);\n          return { hip, knee };\n        }\n        const leftLegObj = makeLeg(-1), rightLegObj = makeLeg(1);\n        animGroup.add(leftLegObj.hip, rightLegObj.hip);\n\n        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.25, 0.64, 14), outfitMat);\n        torso.position.y = 1.0; animGroup.add(torso);\n\n        function makeArm(side) {\n          const sh = new THREE.Group(); sh.position.set(side * 0.3, 1.26, 0);\n          const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.06, 0.5, 8), outfitMat);\n          arm.position.y = -0.23; sh.add(arm);\n          const pom = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), accentMat);\n          pom.position.y = -0.55; sh.add(pom);\n          return sh;\n        }\n        const leftArm = makeArm(-1), rightArm = makeArm(1);\n        animGroup.add(leftArm, rightArm);\n\n        const headGroup = new THREE.Group(); headGroup.position.y = 1.56;\n        headGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), skinMat));\n        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.268, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.56), hairMat);\n        hair.position.y = 0.03; hair.rotation.x = -0.18; headGroup.add(hair);\n        animGroup.add(headGroup);\n\n        const nameTag = makeSpriteLabel(nameText, tagBg, 0.88); nameTag.position.set(0, 2.42, 0); animGroup.add(nameTag);\n        const tickBadge = makeResultBadgeSprite(true); tickBadge.position.set(0, 3.3, 0); tickBadge.visible = false; animGroup.add(tickBadge);\n        const crossBadge = makeResultBadgeSprite(false); crossBadge.position.set(0, 3.3, 0); crossBadge.visible = false; animGroup.add(crossBadge);\n\n        const ring = new THREE.Mesh(new THREE.RingGeometry(0.38, 0.52, 24), new THREE.MeshBasicMaterial({ color: outfitCol, side: THREE.DoubleSide, transparent: true, opacity: 0.78 }));\n        ring.rotation.x = -Math.PI / 2; ring.position.y = 0.035; root.add(ring);\n\n        if (draggableId > 0) {\n          const hit = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 2.5, 12), new THREE.MeshBasicMaterial({ visible: false }));\n          hit.position.y = 1.2; hit.userData = { draggableId }; root.add(hit);\n          root.userData.hitMesh = hit;\n        }\n        Object.assign(root.userData, { kind: 'dancer', mirrorSign, animGroup, leftLegObj, rightLegObj, leftArm, rightArm, headGroup, nameTag, tickBadge, crossBadge });\n        return root;\n      }\n\n      const modelGuitar = createGuitarGirl('Mẫu 1: Đánh đàn', '#db2777', 0xdb2777, 1, 0);\n      const modelDancer = createDancer('Mẫu 2: Cử điệu', '#1d4ed8', 0x1d4ed8, 0xfacc15, 1, 0);\n      const player1Char = createGuitarGirl('Bạn Nữ (NC1)', '#059669', 0x059669, -1, 1);\n      const player2Char = createDancer('Bạn Nam (NC2)', '#ea580c', 0xea580c, 0x7c3aed, -1, 2);\n      scene.add(modelGuitar, modelDancer, player1Char, player2Char);\n\n      const draggableHitMeshes = [player1Char.userData.hitMesh, player2Char.userData.hitMesh];\n\n      const guideGroup = new THREE.Group();\n      scene.add(guideGroup);\n\n      function clearGuides() {\n        while (guideGroup.children.length) guideGroup.remove(guideGroup.children[0]);\n      }\n\n      function addEvalGuide(leftPos, rightPos, isCorrect) {\n        const col = isCorrect ? 0x10b981 : 0xef4444;\n        const p1 = new THREE.Vector3(leftPos.x, 0.08, leftPos.z);\n        const p2 = new THREE.Vector3(rightPos.x, 0.08, rightPos.z);\n        const dir = new THREE.Vector3().subVectors(p2, p1), len = dir.length();\n        if (len > 0.1) {\n          const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, len, 8), new THREE.MeshBasicMaterial({ color: col }));\n          rod.position.copy(p1).lerp(p2, 0.5);\n          rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());\n          guideGroup.add(rod);\n        }\n        if (!isCorrect) {\n          const ghost = new THREE.Mesh(new THREE.RingGeometry(0.38, 0.54, 28), new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide, transparent: true, opacity: 0.8 }));\n          ghost.rotation.x = -Math.PI / 2;\n          ghost.position.set(-leftPos.x, 0.05, leftPos.z);\n          guideGroup.add(ghost);\n        }\n      }\n\n      // =========================================================================\n      // 7. MODES: \"Luật chơi\" (1✓, 2✗) & \"Bắt đầu\" (10s Dalat Music Drag Game)\n      // =========================================================================\n      function syncPositions() {\n        modelGuitar.position.set(state.model1Pos.x, 0, state.model1Pos.z);\n        modelDancer.position.set(state.model2Pos.x, 0, state.model2Pos.z);\n        player1Char.position.set(state.p1Pos.x, 0, state.p1Pos.z);\n        player2Char.position.set(state.p2Pos.x, 0, state.p2Pos.z);\n      }\n\n      function updateUI() {\n        document.getElementById('timer-display').textContent = `${Math.max(0, state.timeLeft).toFixed(1)}s`;\n        document.getElementById('timer-bar').style.width = `${Math.max(0, Math.min(100, (state.timeLeft / 10) * 100))}%`;\n\n        const dot = document.getElementById('music-dot');\n        if (state.phase === 'playing') dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-ping';\n        else if (state.phase === 'finished') dot.className = 'w-2 h-2 rounded-full bg-rose-500';\n        else dot.className = 'w-2 h-2 rounded-full bg-amber-400';\n\n        document.getElementById('btn-rules').classList.toggle('active', state.mode === 'rules');\n        document.getElementById('btn-play').classList.toggle('active', state.mode === 'play');\n        document.getElementById('lbl-play').textContent = (state.mode === 'play' && state.phase === 'finished') ? 'Chơi lại' : 'Bắt đầu';\n\n        const p1 = document.getElementById('pill-p1');\n        const p2 = document.getElementById('pill-p2');\n        const fShort = state.femaleName.length > 9 ? state.femaleName.slice(0, 8) + '…' : state.femaleName;\n        const mShort = state.maleName.length > 9 ? state.maleName.slice(0, 8) + '…' : state.maleName;\n\n        if (state.p1Correct === true) {\n          p1.className = 'px-2 py-1 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-200 truncate flex-1 text-center';\n          p1.textContent = `${fShort}: ✓`;\n        } else if (state.p1Correct === false) {\n          p1.className = 'px-2 py-1 rounded-lg bg-rose-100 text-rose-700 border border-rose-200 truncate flex-1 text-center';\n          p1.textContent = `${fShort}: ✗`;\n        } else {\n          p1.className = 'px-2 py-1 rounded-lg bg-emerald-50 text-emerald-800 truncate flex-1 text-center';\n          p1.textContent = `Kéo ${fShort} & ${mShort}!`;\n        }\n\n        if (state.p2Correct === true) {\n          p2.className = 'px-2 py-1 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-200 truncate';\n          p2.textContent = `${mShort}: ✓`;\n        } else if (state.p2Correct === false) {\n          p2.className = 'px-2 py-1 rounded-lg bg-rose-100 text-rose-700 border border-rose-200 truncate';\n          p2.textContent = `${mShort}: ✗`;\n        } else {\n          p2.className = 'px-2 py-1 rounded-lg bg-orange-50 text-orange-700 truncate';\n          p2.textContent = `${mShort}: ...`;\n        }\n      }\n\n      function evaluateResults() {\n        SoundFX.stopMusic();\n        state.phase = 'finished';\n\n        const d1 = Math.hypot(state.p1Pos.x - (-state.model1Pos.x), state.p1Pos.z - state.model1Pos.z);\n        const d2 = Math.hypot(state.p2Pos.x - (-state.model2Pos.x), state.p2Pos.z - state.model2Pos.z);\n        state.p1Correct = d1 <= SYMMETRY_TOLERANCE;\n        state.p2Correct = d2 <= SYMMETRY_TOLERANCE;\n\n        if (state.p1Correct) { state.p1Pos.x = -state.model1Pos.x; state.p1Pos.z = state.model1Pos.z; }\n        if (state.p2Correct) { state.p2Pos.x = -state.model2Pos.x; state.p2Pos.z = state.model2Pos.z; }\n        syncPositions();\n\n        player1Char.userData.tickBadge.visible = state.p1Correct;\n        player1Char.userData.crossBadge.visible = !state.p1Correct;\n        player2Char.userData.tickBadge.visible = state.p2Correct;\n        player2Char.userData.crossBadge.visible = !state.p2Correct;\n\n        clearGuides();\n        addEvalGuide(state.model1Pos, state.p1Pos, state.p1Correct);\n        addEvalGuide(state.model2Pos, state.p2Pos, state.p2Correct);\n\n        if (state.p1Correct && state.p2Correct) {\n          SoundFX.playCorrect();\n          if (typeof confetti === 'function') confetti({ particleCount: 55, spread: 68, origin: { y: 0.6 } });\n        } else {\n          SoundFX.playWrong();\n        }\n        updateUI();\n      }\n\n      // MODE 1: \"Luật chơi\" — Instant visual demo (NC1 ✓, NC2 ✗)\n      function showRulesDemo() {\n        SoundFX.stopMusic();\n        document.getElementById('rules-example-card').classList.remove('hidden');\n        state.mode = 'rules';\n        state.model1Pos = { x: -2.4, z: -1.3 };\n        state.model2Pos = { x: -3.5, z: 1.45 };\n        state.p1Pos = { x: 2.4, z: -1.3 };  // Exact mirror ✓\n        state.p2Pos = { x: 1.8, z: 0.15 };  // Clearly wrong ✗\n        state.timeLeft = 0.0;\n        syncPositions();\n        evaluateResults();\n      }\n\n      // MODE 2: \"Bắt đầu\" — 10s Dalat Music + Touch Drag-and-Drop Game\n      function startPlayGame() {\n        state.mode = 'play';\n        document.getElementById('rules-example-card').classList.add('hidden');\n        clearGuides();\n        player1Char.userData.tickBadge.visible = false;\n        player1Char.userData.crossBadge.visible = false;\n        player2Char.userData.tickBadge.visible = false;\n        player2Char.userData.crossBadge.visible = false;\n\n        state.model1Pos = { x: -(1.7 + Math.random() * 2.1), z: -(0.7 + Math.random() * 1.4) };\n        state.model2Pos = { x: -(1.8 + Math.random() * 2.2), z: 0.7 + Math.random() * 1.5 };\n        state.p1Pos = { x: 1.4 + Math.random() * 2.8, z: 0.4 + Math.random() * 1.1 };\n        state.p2Pos = { x: 1.4 + Math.random() * 2.8, z: -1.6 + Math.random() * 1.0 };\n\n        state.p1Correct = null;\n        state.p2Correct = null;\n        state.timeLeft = 10.0;\n        state.phase = 'playing';\n\n        syncPositions();\n        SoundFX.startDalatMusic10s();\n        updateUI();\n      }\n\n      // =========================================================================\n      // 8. 1-FINGER DRAG-AND-DROP FOR PLAYERS + 2-FINGER PINCH ZOOM\n      // =========================================================================\n      const raycaster = new THREE.Raycaster();\n      const pointerNDC = new THREE.Vector2();\n      const hitPt = new THREE.Vector3();\n      let draggingId = 0;\n      const domEl = renderer.domElement;\n\n      function updateRay(cx, cy) {\n        const rect = domEl.getBoundingClientRect();\n        pointerNDC.x = ((cx - rect.left) / rect.width) * 2 - 1;\n        pointerNDC.y = -((cy - rect.top) / rect.height) * 2 + 1;\n        raycaster.setFromCamera(pointerNDC, camera);\n      }\n\n      domEl.addEventListener('pointerdown', (e) => {\n        SoundFX.ensureCtx();\n        updateRay(e.clientX, e.clientY);\n        if (state.mode === 'play' && state.phase === 'playing') {\n          const hits = raycaster.intersectObjects(draggableHitMeshes, false);\n          if (hits.length > 0) {\n            draggingId = hits[0].object.userData.draggableId;\n            container.classList.add('dragging-char');\n            return;\n          }\n        }\n        orbit.isDraggingOrbit = true;\n        orbit.lastPos = { x: e.clientX, y: e.clientY };\n      });\n\n      window.addEventListener('pointermove', (e) => {\n        if (draggingId > 0 && state.phase === 'playing') {\n          updateRay(e.clientX, e.clientY);\n          if (raycaster.ray.intersectPlane(dragPlane, hitPt)) {\n            const x = THREE.MathUtils.clamp(hitPt.x, STAGE_BOUNDS.minX, STAGE_BOUNDS.maxX);\n            const z = THREE.MathUtils.clamp(hitPt.z, STAGE_BOUNDS.minZ, STAGE_BOUNDS.maxZ);\n            if (draggingId === 1) { state.p1Pos.x = x; state.p1Pos.z = z; }\n            else { state.p2Pos.x = x; state.p2Pos.z = z; }\n            syncPositions();\n          }\n          return;\n        }\n        if (orbit.isDraggingOrbit) {\n          const dx = e.clientX - orbit.lastPos.x, dy = e.clientY - orbit.lastPos.y;\n          orbit.lastPos = { x: e.clientX, y: e.clientY };\n          orbit.desiredTheta = THREE.MathUtils.clamp(orbit.desiredTheta - dx * 0.006, -1.0, 1.0);\n          orbit.desiredPhi = THREE.MathUtils.clamp(orbit.desiredPhi - dy * 0.006, 0.14, 1.38);\n        }\n      });\n\n      window.addEventListener('pointerup', () => {\n        draggingId = 0;\n        orbit.isDraggingOrbit = false;\n        container.classList.remove('dragging-char');\n      });\n\n      domEl.addEventListener('wheel', (e) => {\n        e.preventDefault();\n        orbit.desiredRadius = THREE.MathUtils.clamp(orbit.desiredRadius + e.deltaY * 0.012, 9, 26);\n      }, { passive: false });\n\n      domEl.addEventListener('touchstart', (e) => {\n        if (e.touches.length === 2) {\n          draggingId = 0; orbit.isDraggingOrbit = false;\n          orbit.pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);\n        }\n      }, { passive: true });\n      domEl.addEventListener('touchmove', (e) => {\n        if (e.touches.length === 2) {\n          const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);\n          orbit.desiredRadius = THREE.MathUtils.clamp(orbit.desiredRadius + (orbit.pinchDist - d) * 0.05, 9, 26);\n          orbit.pinchDist = d;\n        }\n      }, { passive: true });\n\n      // =========================================================================\n      // 9. PLAYER NAME MODAL & BUTTON LISTENERS\n      // =========================================================================\n      const nameModal = document.getElementById('name-modal');\n      const femaleInput = document.getElementById('input-female-name');\n      const maleInput = document.getElementById('input-male-name');\n      const nameError = document.getElementById('name-error');\n\n      function applyBothPlayerNames(fRaw, mRaw) {\n        state.femaleName = fRaw.trim().slice(0, 16);\n        state.maleName = mRaw.trim().slice(0, 16);\n        state.hasEnteredName = true;\n        document.getElementById('lbl-player-badge').textContent = `${state.femaleName} & ${state.maleName}`;\n\n        if (player1Char && player1Char.userData.nameTag) {\n          player1Char.userData.animGroup.remove(player1Char.userData.nameTag);\n          const tag1 = makeSpriteLabel(state.femaleName, '#059669', 0.88);\n          tag1.position.set(0, 2.34, 0);\n          player1Char.userData.animGroup.add(tag1);\n          player1Char.userData.nameTag = tag1;\n        }\n        if (player2Char && player2Char.userData.nameTag) {\n          player2Char.userData.animGroup.remove(player2Char.userData.nameTag);\n          const tag2 = makeSpriteLabel(state.maleName, '#ea580c', 0.88);\n          tag2.position.set(0, 2.42, 0);\n          player2Char.userData.animGroup.add(tag2);\n          player2Char.userData.nameTag = tag2;\n        }\n        updateUI();\n      }\n\n      function openNameModal(startAfter) {\n        femaleInput.value = state.hasEnteredName ? state.femaleName : '';\n        maleInput.value = state.hasEnteredName ? state.maleName : '';\n        nameError.classList.add('hidden');\n        nameModal.dataset.startAfter = startAfter ? '1' : '0';\n        nameModal.classList.remove('hidden');\n        nameModal.classList.add('flex');\n        setTimeout(() => femaleInput.focus(), 80);\n      }\n\n      function closeNameModal() {\n        nameModal.classList.add('hidden');\n        nameModal.classList.remove('flex');\n      }\n\n      function submitBothNames() {\n        const fVal = (femaleInput.value || '').trim();\n        const mVal = (maleInput.value || '').trim();\n        if (!fVal || !mVal) {\n          nameError.classList.remove('hidden');\n          if (!fVal) femaleInput.focus();\n          else maleInput.focus();\n          return;\n        }\n        nameError.classList.add('hidden');\n        applyBothPlayerNames(fVal, mVal);\n        const shouldStart = nameModal.dataset.startAfter === '1';\n        closeNameModal();\n        if (shouldStart) startPlayGame();\n      }\n\n      document.getElementById('btn-edit-name').addEventListener('click', () => openNameModal(false));\n      document.getElementById('btn-close-name').addEventListener('click', closeNameModal);\n      document.getElementById('btn-save-name').addEventListener('click', submitBothNames);\n      femaleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') maleInput.focus(); });\n      maleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitBothNames(); });\n      nameModal.addEventListener('click', (e) => { if (e.target === nameModal) closeNameModal(); });\n      document.getElementById('btn-hide-rules-card').addEventListener('click', () => {\n        document.getElementById('rules-example-card').classList.add('hidden');\n      });\n\n      document.getElementById('btn-rules').addEventListener('click', () => showRulesDemo());\n      document.getElementById('btn-play').addEventListener('click', () => {\n        if (!state.hasEnteredName) openNameModal(true);\n        else startPlayGame();\n      });\n      document.getElementById('btn-check-now').addEventListener('click', () => {\n        if (state.phase === 'playing') evaluateResults();\n      });\n\n      document.getElementById('cam-stage').addEventListener('click', () => applyCameraPreset('stage'));\n      document.getElementById('cam-top').addEventListener('click', () => applyCameraPreset('top'));\n      document.getElementById('btn-sound').addEventListener('click', () => {\n        SoundFX.enabled = !SoundFX.enabled;\n        if (!SoundFX.enabled) SoundFX.stopMusic();\n        document.getElementById('icon-sound').setAttribute('data-lucide', SoundFX.enabled ? 'volume-2' : 'volume-x');\n        if (window.lucide) lucide.createIcons();\n      });\n\n      window.addEventListener('resize', () => {\n        camera.aspect = window.innerWidth / window.innerHeight;\n        camera.updateProjectionMatrix();\n        renderer.setSize(window.innerWidth, window.innerHeight);\n      });\n\n      // =========================================================================\n      // 10. ANIMATION LOOP (GUITAR STRUM + RAISED ARM & BENT LEG + 10s TIMER)\n      // =========================================================================\n      const clock = new THREE.Clock();\n      let rafId = null;\n\n      function animate() {\n        rafId = requestAnimationFrame(animate);\n        const dt = Math.min(0.05, clock.getDelta());\n        const t = clock.elapsedTime;\n\n        if (state.phase === 'playing') {\n          state.timeLeft -= dt;\n          if (state.timeLeft <= 0) {\n            state.timeLeft = 0;\n            SoundFX.playTimeUpBell();\n            evaluateResults();\n          } else {\n            document.getElementById('timer-display').textContent = `${state.timeLeft.toFixed(1)}s`;\n            document.getElementById('timer-bar').style.width = `${(state.timeLeft / 10) * 100}%`;\n          }\n        }\n\n        [modelGuitar, player1Char].forEach(ch => {\n          const ud = ch.userData, s = ud.mirrorSign;\n          ud.strumArm.rotation.x = Math.sin(t * 9.0) * 0.28;\n          ud.headGroup.rotation.z = Math.sin(t * 2.6) * 0.08 * s;\n        });\n\n        [modelDancer, player2Char].forEach(ch => {\n          const ud = ch.userData, s = ud.mirrorSign, wave = Math.sin(t * 4.0);\n          ud.animGroup.position.y = Math.abs(wave) * 0.06;\n          if (s === 1) {\n            ud.leftArm.rotation.z = -2.55 + wave * 0.2;\n            ud.rightArm.rotation.z = 1.45 - wave * 0.18;\n            ud.rightLegObj.hip.rotation.x = -1.18 + wave * 0.08;\n            ud.rightLegObj.knee.rotation.x = 1.45;\n          } else {\n            ud.rightArm.rotation.z = 2.55 - wave * 0.2;\n            ud.leftArm.rotation.z = -1.45 + wave * 0.18;\n            ud.leftLegObj.hip.rotation.x = -1.18 + wave * 0.08;\n            ud.leftLegObj.knee.rotation.x = 1.45;\n          }\n        });\n\n        [player1Char, player2Char].forEach(c => {\n          const h = c.userData.kind === 'guitar' ? 3.24 : 3.3;\n          if (c.userData.tickBadge.visible) c.userData.tickBadge.position.y = h + Math.sin(t * 5.2) * 0.08;\n          if (c.userData.crossBadge.visible) c.userData.crossBadge.position.y = h + Math.sin(t * 6.2) * 0.08;\n        });\n\n        audienceSpectators.forEach(sp => {\n          sp.pivot.rotation.z = Math.sin(t * 2.8 + sp.phase) * 0.06;\n          const clap = Math.sin(t * 7.5 + sp.phase) * 0.18;\n          sp.aL.rotation.z = -0.25 + clap;\n          sp.aR.rotation.z = 0.25 - clap;\n        });\n\n        updateCamera(dt);\n        renderer.render(scene, camera);\n      }\n\n      window.onload = function () {\n        if (window.lucide) lucide.createIcons();\n        applyCameraPreset('stage');\n        orbit.theta = orbit.desiredTheta;\n        orbit.phi = orbit.desiredPhi;\n        orbit.radius = orbit.desiredRadius;\n        orbit.target.copy(orbit.desiredTarget);\n        updateCamera(1);\n\n        if (rafId) cancelAnimationFrame(rafId);\n        animate();\n        showRulesDemo();\n      };\n    })();\n  <\/script>\n</body>\n</html>", "doixungtam": "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\" />\n  <title>Phép Đối Xứng Tâm (Mobile) — Festival Hoa Đà Lạt lần thứ 11</title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n  <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap\" rel=\"stylesheet\" />\n  <script src=\"https://cdn.tailwindcss.com/3.4.17\"><\/script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n  <script src=\"https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js\"><\/script>\n  <script src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js\"><\/script>\n  <style>\n    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n    html, body {\n      margin: 0;\n      padding: 0;\n      width: 100%;\n      height: 100%;\n      overflow: hidden;\n      font-family: 'Inter', system-ui, -apple-system, sans-serif;\n      background: #062c22;\n      user-select: none;\n      display: flex;\n      flex-direction: column;\n    }\n    /* 9:13 top board display area (13/16 = 81.25% of 9:16 mobile screen) */\n    #board-stage-wrap {\n      position: relative;\n      width: 100%;\n      height: 81.25%;\n      flex: 0 0 81.25%;\n      overflow: hidden;\n      background: #062c22;\n    }\n    #canvas-container {\n      position: absolute;\n      inset: 0;\n      width: 100%;\n      height: 100%;\ ong>cách đều tâm I</strong> theo nét đứt và <strong>xoay ngược 180°</strong> so với hình mẫu.</div>\n        <div>• <strong>Thao tác cảm ứng:</strong> Kéo hình để di chuyển; kéo nút tròn xanh (<strong>↻</strong>) hoặc xoay bằng <strong>2 ngón tay</strong>.</div>\n        <div class=\"text-slate-600 font-semibold pt-0.5\">👉 Bấm <strong>Bắt đầu</strong>, nhập tên rồi sắp xếp &amp; xoay 180° trong 20 giây nhạc Đà Lạt!</div>\n      </div>\n    </div>\n  </section>\n\n  <!-- BOTTOM 9:3 REGION (18.75% height): Dedicated Control Panel Dock -->\n  <footer id=\"control-dock-wrap\" class=\"z-20 flex items-center justify-center px-2.5 py-1.5\">\n    <div class=\"glass w-full max-w-md rounded-2xl px-2.5 py-2 flex flex-col justify-center gap-1.5\">\n      <!-- Row 1: 20s Music Timer + Item Status + Quick Touch Rotate -->\n      <div class=\"flex items-center justify-between gap-1.5 text-[11px] font-bold\">\n        <div class=\"flex items-center gap-1.5 px-2 py-1 rounded-lg bg-slate-900 text-white shrink-0\">\n          <span id=\"music-dot\" class=\"w-2 h-2 rounded-full bg-amber-400\"></span>\n          <span id=\"timer-display\" class=\"tabular-nums font-extrabold\">20.0s</span>\n          <div class=\"w-10 h-1.5 bg-slate-700 rounded-full overflow-hidden\">\n            <div id=\"timer-bar\" class=\"h-full bg-gradient-to-r from-emerald-400 via-amber-400 to-pink-500\" style=\"width:100%;\"></div>\n          </div>\n        </div>\n\n        <span id=\"pill-status\" class=\"px-2 py-1 rounded-lg bg-slate-100 text-slate-700 truncate flex-1 text-center\">\n          Dâu tây: ✓\n        </span>\n\n        <div class=\"flex items-center gap-1 shrink-0\">\n          <button id=\"rot-left\" class=\"px-1.5 py-1 rounded-lg bg-slate-100 active:bg-slate-200 text-slate-800 font-extrabold\" title=\"Xoay trái\">↺</button>\n          <button id=\"rot-180\" class=\"px-1.5 py-1 rounded-lg bg-amber-100 active:bg-amber-200 text-amber-900 font-extrabold\" title=\"Xoay 180 độ\">180°</button>\n l;\n          if (!this.ctx) {\n            const AudioCtx = window.AudioContext || window.webkitAudioContext;\n            if (AudioCtx) this.ctx = new AudioCtx();\n          }\n          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});\n          return this.ctx;\n        },\n        stopMusic() {\n          this.activeNodes.forEach(n => { try { n.stop(); } catch (e) {} });\n          this.activeNodes = [];\n        },\n        playTone(freq, startOffset, dur, type = 'triangle', vol = 0.08) {\n          const ctx = this.ensureCtx();\n          if (!ctx) return;\n          const now = ctx.currentTime + startOffset;\n          const osc = ctx.createOscillator(), gain = ctx.createGain();\n          osc.type = type;\n          osc.frequency.setValueAtTime(freq, now);\n          gain.gain.setValueAtTime(0.001, now);\n          gain.gain.linearRampToValueAtTime(vol, now + 0.03);\n          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);\n          osc.connect(gain); gain.connect(ctx.destination);\n          osc.start(now); osc.stop(now + dur + 0.02);\n          this.activeNodes.push(osc);\n        },\n        startDalatMusic20s() {\n          this.stopMusic();\n          const ctx = this.ensureCtx();\n          if (!ctx) return;\n          const beat = 0.33;\n          const melody = [\n            [329.63, 0, 2], [392.00, 2, 1], [493.88, 3, 2], [440.00, 5, 1],\n            [523.25, 6, 2], [493.88, 8, 1], [392.00, 9, 3],\n            [440.00, 12, 2], [493.88, 14, 1], [587.33, 15, 2], [523.25, 17, 1],\n            [493.88, 18, 2], [392.00, 20, 1], [440.00, 21, 3],\n            [659.25, 24, 2], [587.33, 26, 1], [523.25, 27, 2], [493.88, 29, 1],\n            [440.00, 30, 2], [493.88, 32, 1], [392.00, 33, 3],\n            [329.63, 36, 2], [392.00, 38, 1], [440.00, 39, 2], [493.88, 41, 1],\n            [587.33, 42, 2], [523.25, 44, 1], [493.88, 45, 3],\n            [659.25, 48, 2], [587.33, 50, 1], [493.88, 51, 2], [440.00, 53, 1], beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke();\n            });\n          }\n        },\n        {\n          id: 'artichoke', name: 'Bông Atisô',\n          draw(ctx) {\n            ctx.fillStyle = '#22c55e'; ctx.fillRect(112, 174, 32, 64);\n            [{ y: 158, w: 74, h: 52, col: '#166534' }, { y: 130, w: 66, h: 52, col: '#16a34a' }, { y: 102, w: 54, h: 48, col: '#22c55e' }, { y: 74, w: 38, h: 44, col: '#8b5cf6' }].forEach(l => {\n              ctx.fillStyle = l.col;\n              ctx.beginPath();\n              ctx.moveTo(128, l.y - l.h);\n              ctx.quadraticCurveTo(128 + l.w, l.y - 8, 128 + l.w * 0.65, l.y + 26);\n              ctx.lineTo(128 - l.w * 0.65, l.y + 26);\n              ctx.quadraticCurveTo(128 - l.w, l.y - 8, 128, l.y - l.h);\n              ctx.fill(); ctx.strokeStyle = '#dcfce7'; ctx.lineWidth = 3.5; ctx.stroke();\n            });\n          }\n        },\n        {\n          id: 'hydrangea', name: 'Cẩm Tú Cầu',\n          draw(ctx) {\n            ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 14; ctx.lineCap = 'round';\n            ctx.beginPath(); ctx.moveTo(128, 145); ctx.lineTo(128, 236); ctx.stroke();\n            ctx.fillStyle = '#16a34a';\n            ctx.beginPath(); ctx.ellipse(90, 196, 30, 15, -0.45, 0, Math.PI * 2); ctx.fill();\n            ctx.beginPath(); ctx.ellipse(166, 196, 30, 15, 0.45, 0, Math.PI * 2); ctx.fill();\n            [[128,66,'#3b82f6'],[92,82,'#60a5fa'],[164,82,'#818cf8'],[76,116,'#38bdf8'],[128,106,'#2563eb'],[180,116,'#8b5cf6'],[100,136,'#60a5fa'],[156,136,'#a78bfa'],[128,144,'#3b82f6']].forEach(([fx,fy,col]) => {\n              ctx.fillStyle = col; ctx.beginPath(); ctx.arc(fx, fy, 27, 0, Math.PI * 2); ctx.fill();\n              ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(fx, fy, 6, 0, Math.PI * 2); ctx.fill();\n            });\n          }\n        },\n        {\n          id: 'daquy', name: 'Hoa Dã Quỳ',\n          draw(ctx) {\n            ctx.strokeStyle = '#22c55e'; ctx.lineWidth t(-4, 10, 12);\n      scene.add(sunLight);\n\n      function updateFixed2DCamera() {\n        const w = Math.max(1, container.clientWidth);\n        const h = Math.max(1, container.clientHeight);\n        const aspect = w / h;\n        camera.aspect = aspect;\n        camera.updateProjectionMatrix();\n        renderer.setSize(w, h);\n\n        // Exact 9:13 full-bleed portrait chalkboard fit (halfW = 4.5, halfH = 6.5 => 9:13)\n        const neededHalfW = 4.5;\n        const neededHalfH = 6.5;\n        const vFovRad = THREE.MathUtils.degToRad(camera.fov);\n        const distForH = neededHalfH / Math.tan(vFovRad / 2);\n        const distForW = neededHalfW / (Math.tan(vFovRad / 2) * aspect);\n        const dist = Math.max(distForW, distForH);\n\n        camera.position.set(0, BOARD_CENTER_Y, BOARD_Z + dist);\n        camera.lookAt(0, BOARD_CENTER_Y, BOARD_Z);\n      }\n\n      // =========================================================================\n      // 5. FULL 9:13 GREEN CHALKBOARD STAGE + DALAT SPECIALTIES + CENTER POINT I\n      // =========================================================================\n      const roomGroup = new THREE.Group();\n      scene.add(roomGroup);\n\n      const hallMat = new THREE.MeshStandardMaterial({ color: 0x062c22, roughness: 0.9 });\n      const goldTrimMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xd97706, emissiveIntensity: 0.32, roughness: 0.32 });\n      const curtainMat = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.72 });\n      const trussMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.6, roughness: 0.4 });\n\n      const frontWall = new THREE.Mesh(new THREE.BoxGeometry(28, 20, 0.35), hallMat);\n      frontWall.position.set(0, 0, -4.95);\n      roomGroup.add(frontWall);\n\n      function createStageBackdropTexture() {\n        const c = document.createElement('canvas');\n        c.width = 900; c.height = 1300;\n        const ctx = c.getContext('2d');\n\n        // Rich Deep Green Chalkboard Stage Gradient (9:13 portrait)\n        const grad = ctx.createLinearGradient(0, 0, 0, 1300);\n        grad.addColorStop(0, '#0f4c3a');\n        grad.addColorStop(0.5, '#0b3d2e');\n        grad.addColorStop(1, '#072c21');\n        ctx.fillStyle = grad;\n        ctx.fillRect(0, 0, 900, 1300);\n\n        // Soft warm stage bokeh lights on chalkboard\n        const bCols = ['rgba(251,191,36,0.09)', 'rgba(244,114,182,0.08)', 'rgba(52,211,153,0.09)'];\n        for (let i = 0; i < 20; i++) {\n          ctx.fillStyle = bCols[i % 3];\n          ctx.beginPath();\n          ctx.arc(((i * 173 + 70) % 760) + 70, ((i * 211 + 190) % 920) + 190, 22 + (i % 4) * 14, 0, Math.PI * 2);\n          ctx.fill();\n        }\n\n        // Subtle chalk inner border around playable green zone\n        ctx.strokeStyle = 'rgba(254, 240, 138, 0.24)';\n        ctx.lineWidth = 3;\n        ctx.strokeRect(24, 24, 852, 1252);\n\n        // Golden Stage Header (positioned cleanly below the top overlay buttons)\n        ctx.fillStyle = '#fde047';\n        ctx.font = '800 36px Inter, sans-serif';\n        ctx.textAlign = 'center';\n        ctx.fillText('FESTIVAL HOA ĐÀ LẠT LẦN THỨ 11', 450, 114);\n\n        ctx.fillStyle = '#f9a8d4';\n        ctx.font = '800 20px Inter, sans-serif';\n        ctx.fillText('SÂN KHẤU ĐẶC SẢN ĐÀ LẠT • PHÉP ĐỐI XỨNG TÂM I', 450, 148);\n\n        ctx.strokeStyle = 'rgba(253, 224, 71, 0.45)';\n        ctx.lineWidth = 2.5;\n        ctx.beginPath(); ctx.moveTo(56, 168); ctx.lineTo(844, 168); ctx.stroke();\n\n        // Subtle center crosshairs through Center I (helps visual orientation without clutter)\n        ctx.save();\n        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';\n        ctx.setLineDash([10, 10]);\n        ctx.lineWidth = 2;\n        ctx.beginPath(); ctx.moveTo(60, 650); ctx.lineTo(840, 650); ctx.stroke();\n        ctx.beginPath(); ctx.moveTo(450, 240); ctx.lineTo(450, 1060); ctx.stroke();\n        ctx.restore();\n\n        // Bottom decorative Dalat Specialty Strip (Hoa, Quả, Rau, Trà, Cà phê)\n        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';\n        ctx.fillRect(28, 1218, 844, 52);\n        ctx.fillStyle = '#fef08a';\n        ctx.font = '700 20px Inter, sans-serif';\n        ctx.fillText('🌸 Hoa  •  🍓 Dâu & Hồng  •  🥦 Rau củ  •  🍵 Trà  •  ☕ Cà phê', 450, 1251);\n\n        const tex = new THREE.CanvasTexture(c);\n        tex.encoding = THREE.sRGBEncoding;\n        return tex;\n      }\n\n      // Golden Stage Frame + Full 9:13 Green Chalkboard Surface\n      const boardFrame = new THREE.Mesh(new THREE.BoxGeometry(9.0, 13.0, 0.2), goldTrimMat);\n      boardFrame.position.set(0, BOARD_CENTER_Y, -4.72);\n      roomGroup.add(boardFrame);\n\n      const boardSurface = new THREE.Mesh(\n        new THREE.PlaneGeometry(8.68, 12.68),\n        new THREE.MeshStandardMaterial({ map: createStageBackdropTexture(), roughness: 0.62 })\n      );\n      boardSurface.position.set(0, BOARD_CENTER_Y, BOARD_Z - 0.04);\n      roomGroup.add(boardSurface);\n\n      // Sweeping Red Velvet Side Stage Curtains (outside the 9:13 gold border for wide/desktop view)\n      [-4.95, 4.95].forEach(cx => {\n        for (let f = 0; f < 3; f++) {\n          const pleat = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.3, 13.6, 12), curtainMat);\n          pleat.position.set(cx + (f - 1) * 0.28, BOARD_CENTER_Y, -4.64);\n          roomGroup.add(pleat);\n        }\n      });\n\n      // Overhead Stage Lighting Truss + Glowing Colored Spotlights\n      const topTruss = new THREE.Mesh(new THREE.BoxGeometry(9.4, 0.18, 0.18), trussMat);\n      topTruss.position.set(0, 6.42, -4.35);\n      roomGroup.add(topTruss);\n      const spotCols = [0xfacc15, 0xf472b6, 0x38bdf8, 0x34d399, 0xfacc15];\n      [-3.2, -1.6, 0, 1.6, 3.2].forEach((sx, idx) => {\n        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 10), new THREE.MeshBasicMaterial({ color: spotCols[idx] }));\n        bulb.position.set(sx, 6.28, -4.22);\n        roomGroup.add(bulb);\n      });\n\n      // Decorative Dalat Specialty Medallions (4 at Top + 4 at Bottom inside 9:13 stage, never overlapping playable center!)\n      function makeSpecialtyDecorIcon(type) {\n        const c = document.createElement('canvas'); c.width = 160; c.height = 160;\n        const ctx = c.getContext('2d');\n        ctx.beginPath(); ctx.arc(80, 80, 72, 0, Math.PI * 2);\n        ctx.fillStyle = 'rgba(255, 251, 235, 0.94)'; ctx.fill();\n        ctx.lineWidth = 6; ctx.strokeStyle = '#facc15'; ctx.stroke();\n\n        if (type === 'coffee') {\n          ctx.fillStyle = '#78350f'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(42, 64, 68, 56, 14) : ctx.fillRect(42, 64, 68, 56); ctx.fill();\n          ctx.strokeStyle = '#78350f'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(112, 88, 16, -1.4, 1.4); ctx.stroke();\n          ctx.fillStyle = '#451a03'; ctx.beginPath(); ctx.ellipse(76, 66, 30, 8, 0, 0, Math.PI * 2); ctx.fill();\n          ctx.strokeStyle = '#d97706'; ctx.lineWidth = 5; ctx.lineCap = 'round';\n          [60, 76, 92].forEach(sx => { ctx.beginPath(); ctx.moveTo(sx, 50); ctx.quadraticCurveTo(sx + 6, 40, sx, 30); ctx.stroke(); });\n        } else if (type === 'tea') {\n          ctx.fillStyle = '#16a34a';\n          ctx.beginPath(); ctx.ellipse(62, 72, 26, 14, -0.5, 0, Math.PI * 2); ctx.fill();\n          ctx.fillStyle = '#22c55e';\n          ctx.beginPath(); ctx.ellipse(98, 68, 26, 14, 0.5, 0, Math.PI * 2); ctx.fill();\n          ctx.fillStyle = '#15803d'; ctx.beginPath(); ctx.arc(80, 108, 28, 0, Math.PI); ctx.fill();\n          ctx.fillStyle = '#bbf7d0'; ctx.fillRect(52, 98, 56, 12);\n        } else {\n          const found = SPECIALTIES.find(sp => sp.id === type) || SPECIALTIES[0];\n          ctx.save(); ctx.translate(16, 16); ctx.scale(0.5, 0.5); found.draw(ctx); ctx.restore();\n        }\n        const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;\n        return new THREE.Mesh(new THREE.PlaneGeometry(0.84, 0.84), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));\n      }\n\n      const topDecor = ['coffee', 'strawberry', 'broccoli', 'hydrangea'];\n      const bottomDecor = ['tea', 'persimmon', 'carrot', 'daquy'];\n      const decorXs = [-3.1, -1.05, 1.05, 3.1];\n      [0, 1, 2, 3].forEach(idx => {\n        const mT = makeSpecialtyDecorIcon(topDecor[idx]);\n        mT.position.set(decorXs[idx], 4.42, BOARD_Z + 0.01);\n        roomGroup.add(mT);\n        const mB = makeSpecialtyDecorIcon(bottomDecor[idx]);\n        mB.position.set(decorXs[idx], -5.12, BOARD_Z + 0.01);\n        roomGroup.add(mB);\n      });\n\n      const boardDragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -BOARD_Z);\n\n      // Center Point I\n      const centerGroup = new THREE.Group();\n      centerGroup.position.set(0, BOARD_CENTER_Y, BOARD_Z + 0.04);\n      centerGroup.add(new THREE.Mesh(\n        new THREE.SphereGeometry(0.17, 20, 20),\n        new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xf59e0b, emissiveIntensity: 0.7 })\n      ));\n      const centerHalo = new THREE.Mesh(\n        new THREE.RingGeometry(0.24, 0.34, 32),\n        new THREE.MeshBasicMaterial({ color: 0xfde047, side: THREE.DoubleSide })\n      );\n      centerGroup.add(centerHalo);\n\n      function makeSmallSprite(text, bgColor, scale = 0.58) {\n        const c = document.createElement('canvas');\n        c.width = 280; c.height = 84;\n        const ctx = c.getContext('2d');\n        const r = 20;\n        ctx.fillStyle = bgColor;\n        ctx.beginPath();\n        ctx.moveTo(10 + r, 10); ctx.lineTo(270 - r, 10);\n        ctx.quadraticCurveTo(270, 10, 270, 10 + r); ctx.lineTo(270, 74 - r);\n        ctx.quadraticCurveTo(270, 74, 270 - r, 74); ctx.lineTo(10 + r, 74);\n        ctx.quadraticCurveTo(10, 74, 10, 74 - r); ctx.lineTo(10, 10 + r);\n        ctx.quadraticCurveTo(10, 10, 10 + r, 10); ctx.closePath(); ctx.fill();\n        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.stroke();\n        ctx.fillStyle = '#ffffff';\n        ctx.font = '800 30px Inter, sans-serif';\n        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n        ctx.fillText(text, 140, 43);\n        const tex = new THREE.CanvasTexture(c);\n        tex.encoding = THREE.sRGBEncoding;\n        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));\n        sp.scale.set(scale * 2.25, scale * 0.68, 1);\n        sp.renderOrder = 25;\n        return sp;\n      }\n\n      const centerLbl = makeSmallSprite('Tâm I', '#d97706', 0.55);\n      centerLbl.position.set(0, -0.52, 0.06);\n      centerGroup.add(centerLbl);\n      scene.add(centerGroup);\n\n      // Floral Garland Framing the Green Board\n      const flowerColors = [0xe11d48, 0xeab308, 0x2563eb, 0x7c3aed, 0xdb2777, 0xea580c];\n      const leafMatBright = new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.55 });\n      const leafMatDeep = new THREE.MeshStandardMaterial({ color: 0x14532d, roughness: 0.62 });\n      const centerYellowMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 });\n      const petalGeo = new THREE.SphereGeometry(0.13, 8, 8);\n      const ctrGeo = new THREE.SphereGeometry(0.09, 8, 8);\n\n      function createBlossom(hexColor, scale = 1.15) {\n        const g = new THREE.Group();\n        const mat = new THREE.MeshStandardMaterial({ color: hexColor, roughness: 0.45 });\n        for (let i = 0; i < 6; i++) {\n          const ang = (i / 6) * Math.PI * 2;\n          const p = new THREE.Mesh(petalGeo, mat);\n          p.position.set(Math.cos(ang) * 0.14, Math.sin(ang) * 0.14, 0);\n          p.scale.set(1.15, 0.85, 0.55); g.add(p);\n        }\n        const ctr = new THREE.Mesh(ctrGeo, centerYellowMat); ctr.position.z = 0.04; g.add(ctr);\n        g.scale.setScalar(scale);\n        return g;\n      }\n\n      for (let i = 0; i <= 18; i++) {\n        const gx = -4.2 + (i / 18) * 8.4, gy = 6.26 + Math.sin(i * 0.7) * 0.07;\n        const leaf = new THREE.Mesh(new THREE.DodecahedronGeometry(0.18, 0), i % 2 === 0 ? leafMatBright : leafMatDeep);\n        leaf.position.set(gx, gy, -4.5); roomGroup.add(leaf);\n        if (i % 2 === 0) {\n          const fl = createBlossom(flowerColors[i % flowerColors.length], 0.92);\n          fl.position.set(gx, gy, -4.36); roomGroup.add(fl);\n        }\n      }\n\n      // =========================================================================\n      // 6. CUTOUT STICKERS, ROTATE HANDLE (↻), DASHED LINE & ANSWER DISPLAY\n      // =========================================================================\n      const cardsGroup = new THREE.Group(); scene.add(cardsGroup);\n      const dashedGroup = new THREE.Group(); scene.add(dashedGroup);\n      const evalGroup = new THREE.Group(); scene.add(evalGroup);\n\n      function makeRotateHandleTexture() {\n        const c = document.createElement('canvas'); c.width = 160; c.height = 160;\n        const ctx = c.getContext('2d');\n        ctx.beginPath(); ctx.arc(80, 80, 68, 0, Math.PI * 2);\n        ctx.fillStyle = '#0284c7'; ctx.fill();\n        ctx.lineWidth = 10; ctx.strokeStyle = '#ffffff'; ctx.stroke();\n        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 12; ctx.lineCap = 'round';\n        ctx.beginPath(); ctx.arc(80, 80, 32, -Math.PI * 0.75, Math.PI * 0.85); ctx.stroke();\n        ctx.fillStyle = '#ffffff';\n        ctx.beginPath(); ctx.moveTo(116, 62); ctx.lineTo(100, 36); ctx.lineTo(126, 42); ctx.closePath(); ctx.fill();\n        const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; return tex;\n      }\n      const rotateHandleTex = makeRotateHandleTexture();\n\n      function makeResultBadgeSprite(isCorrect) {\n        const c = document.createElement('canvas'); c.width = 256; c.height = 256;\n        const ctx = c.getContext('2d');\n        ctx.beginPath(); ctx.arc(128, 128, 108, 0, Math.PI * 2);\n        ctx.fillStyle = isCorrect ? '#10b981' : '#ef4444'; ctx.fill();\n        ctx.lineWidth = 14; ctx.strokeStyle = '#ffffff'; ctx.stroke();\n        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 26; ctx.lineCap = 'round'; ctx.lineJoin = 'round';\n        ctx.beginPath();\n        if (isCorrect) { ctx.moveTo(72, 134); ctx.lineTo(112, 174); ctx.lineTo(186, 86); }\n        else { ctx.moveTo(82, 82); ctx.lineTo(174, 174); ctx.moveTo(174, 82); ctx.lineTo(82, 174); }\n        ctx.stroke();\n        const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;\n        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));\n        sp.scale.set(0.95, 0.95, 1); sp.renderOrder = 30; return sp;\n      }\n\n      let leftStickerMesh = null, rightStickerMesh = null, tickBadge = null, crossBadge = null;\n      let selectionRing = null, rotateHandleMesh = null, rotateStemLine = null;\n\n      function boardToWorld(bx, by, zOff = 0.06) {\n        return new THREE.Vector3(bx, BOARD_CENTER_Y + by, BOARD_Z + zOff);\n      }\n\n      function rebuildBoardItem() {\n        while (cardsGroup.children.length) cardsGroup.remove(cardsGroup.children[0]);\n        while (dashedGroup.children.length) dashedGroup.remove(dashedGroup.children[0]);\n        while (evalGroup.children.length) evalGroup.remove(evalGroup.children[0]);\n\n        const item = state.item;\n        const planeGeo = new THREE.PlaneGeometry(1.9, 1.9);\n        const tex = createCutoutTexture(item.spec);\n\n        leftStickerMesh = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.05, side: THREE.DoubleSide }));\n        leftStickerMesh.position.copy(boardToWorld(item.leftPos.x, item.leftPos.y, 0.05));\n        leftStickerMesh.rotation.z = THREE.MathUtils.degToRad(item.leftAngleDeg);\n        cardsGroup.add(leftStickerMesh);\n\n        // Dashed direction line through Center I\n        const pLeft = boardToWorld(item.leftPos.x, item.leftPos.y, 0.02);\n        const dir = new THREE.Vector3(-item.leftPos.x, -item.leftPos.y, 0).normalize();\n        const tFar = Math.min(dir.x !== 0 ? Math.abs((BOARD_HALF_W + 0.15) / dir.x) : 99, dir.y !== 0 ? Math.abs((BOARD_HALF_H + 0.15) / dir.y) : 99);\n        const pFar = boardToWorld(dir.x * tFar, dir.y * tFar, 0.02);\n        const dashLine = new THREE.Line(\n          new THREE.BufferGeometry().setFromPoints([pLeft, pFar]),\n          new THREE.LineDashedMaterial({ color: 0xfde047, dashSize: 0.2, gapSize: 0.14, transparent: true, opacity: 0.85 })\n        );\n        dashLine.computeLineDistances();\n        dashedGroup.add(dashLine);\n\n        rightStickerMesh = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.05, side: THREE.DoubleSide }));\n        cardsGroup.add(rightStickerMesh);\n\n        selectionRing = new THREE.Mesh(new THREE.RingGeometry(0.9, 0.96, 36), new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.65 }));\n        cardsGroup.add(selectionRing);\n\n        rotateStemLine = new THREE.Line(\n          new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.92, 0), new THREE.Vector3(0, HANDLE_RADIUS, 0)]),\n          new THREE.LineBasicMaterial({ color: 0x38bdf8 })\n        );\n        cardsGroup.add(rotateStemLine);\n\n        rotateHandleMesh = new THREE.Mesh(new THREE.CircleGeometry(0.36, 28), new THREE.MeshBasicMaterial({ map: rotateHandleTex, transparent: true, side: THREE.DoubleSide }));\n        cardsGroup.add(rotateHandleMesh);\n\n        tickBadge = makeResultBadgeSprite(true); tickBadge.visible = false;\n        crossBadge = makeResultBadgeSprite(false); crossBadge.visible = false;\n        cardsGroup.add(tickBadge, crossBadge);\n\n        dashedGroup.visible = state.showDashed;\n        syncRightTransform();\n      }\n\n      function syncRightTransform() {\n        const item = state.item;\n        const rad = THREE.MathUtils.degToRad(item.rightAngleDeg);\n        if (rightStickerMesh) {\n          rightStickerMesh.position.copy(boardToWorld(item.rightPos.x, item.rightPos.y, 0.11));\n          rightStickerMesh.rotation.z = rad;\n        }\n        const showInteractive = (state.mode === 'play' && state.phase === 'playing');\n        if (selectionRing) {\n          selectionRing.position.copy(boardToWorld(item.rightPos.x, item.rightPos.y, 0.07));\n          selectionRing.visible = showInteractive;\n        }\n        if (rotateHandleMesh && rotateStemLine) {\n          const hx = item.rightPos.x - Math.sin(rad) * HANDLE_RADIUS;\n          const hy = item.rightPos.y + Math.cos(rad) * HANDLE_RADIUS;\n          rotateHandleMesh.position.copy(boardToWorld(hx, hy, 0.16));\n          rotateHandleMesh.visible = showInteractive;\n          rotateStemLine.position.copy(boardToWorld(item.rightPos.x, item.rightPos.y, 0.08));\n          rotateStemLine.rotation.z = rad;\n          rotateStemLine.visible = showInteractive;\n        }\n        const bPos = boardToWorld(item.rightPos.x + 0.72, item.rightPos.y + 0.75, 0.25);\n        if (tickBadge) tickBadge.position.copy(bPos);\n        if (crossBadge) crossBadge.position.copy(bPos);\n      }\n\n      // =========================================================================\n      // 7. MODES: \"Luat choi\" (Visual Example ✓) & \"Bat dau\" (20s Touch Game)\n      // =========================================================================\n      function updateUI() {\n        document.getElementById('timer-display').textContent = `${Math.max(0, state.timeLeft).toFixed(1)}s`;\n        document.getElementById('timer-bar').style.width = `${Math.max(0, Math.min(100, (state.timeLeft / ROUND_DURATION) * 100))}%`;\n\n        const dot = document.getElementById('music-dot');\n        if (state.phase === 'playing') dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-ping';\n        else if (state.phase === 'finished') dot.className = 'w-2 h-2 rounded-full bg-rose-500';\n        else dot.className = 'w-2 h-2 rounded-full bg-amber-400';\n\n        document.getElementById('btn-rules').classList.toggle('active', state.mode === 'rules');\n        document.getElementById('btn-play').classList.toggle('active', state.mode === 'play');\n        document.getElementById('lbl-play').textContent = (state.mode === 'play' && state.phase === 'finished') ? 'Chơi lại' : 'Bắt đầu';\n\n        const st = document.getElementById('pill-status');\n        const name = state.item.spec.name;\n        if (state.item.isCorrect === true) {\n          st.className = 'px-2 py-1 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-200 truncate flex-1 text-center';\n          st.textContent = `${name}: ✓ ĐÚNG`;\n        } else if (state.item.isCorrect === false) {\n          st.className = 'px-2 py-1 rounded-lg bg-rose-100 text-rose-700 border border-rose-200 truncate flex-1 text-center';\n          st.textContent = `${name}: ✗ SAI`;\n        } else {\n          st.className = 'px-2 py-1 rounded-lg bg-emerald-50 text-emerald-800 truncate flex-1 text-center';\n          st.textContent = `${name} (${Math.round(normalizeAngleDeg(state.item.rightAngleDeg))}°)`;\n        }\n      }\n\n      function renderAnswerGuide(item, tx, ty, tAng) {\n        const p1 = boardToWorld(item.leftPos.x, item.leftPos.y, 0.03);\n        const pAns = boardToWorld(tx, ty, 0.03);\n        const dir = new THREE.Vector3().subVectors(pAns, p1), len = dir.length();\n        if (len > 0.1) {\n          const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.034, len, 8), new THREE.MeshBasicMaterial({ color: 0x10b981 }));\n          rod.position.copy(p1).lerp(pAns, 0.5);\n          rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());\n          evalGroup.add(rod);\n        }\n        if (!item.isCorrect) {\n          const ansTex = createCutoutTexture(item.spec, 'rgba(16, 185, 129, 0.95)');\n          const ansMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 1.9), new THREE.MeshBasicMaterial({ map: ansTex, transparent: true, opacity: 0.9, alphaTest: 0.05, side: THREE.DoubleSide }));\n          ansMesh.position.copy(boardToWorld(tx, ty, 0.08));\n          ansMesh.rotation.z = THREE.MathUtils.degToRad(tAng);\n          evalGroup.add(ansMesh);\n\n          const halo = new THREE.Mesh(new THREE.RingGeometry(0.92, 1.0, 36), new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide }));\n          halo.position.copy(boardToWorld(tx, ty, 0.06));\n          evalGroup.add(halo);\n\n          const lbl = makeSmallSprite('Đáp án đúng ✓', '#059669', 0.58);\n          lbl.position.copy(boardToWorld(tx, ty - 1.1, 0.22));\n          evalGroup.add(lbl);\n        }\n      }\n\n      function evaluateResults() {\n        SoundFX.stopMusic();\n        state.phase = 'finished';\n        while (evalGroup.children.length) evalGroup.remove(evalGroup.children[0]);\n\n        const item = state.item;\n        const tx = -item.leftPos.x, ty = -item.leftPos.y;\n        const tAng = normalizeAngleDeg(item.leftAngleDeg + 180);\n        const dist = Math.hypot(item.rightPos.x - tx, item.rightPos.y - ty);\n        const aErr = shortestAngleDiffDeg(item.rightAngleDeg, tAng);\n\n        item.isCorrect = (dist <= POS_TOLERANCE && aErr <= ANGLE_TOLERANCE_DEG);\n        if (item.isCorrect) {\n          item.rightPos.x = tx; item.rightPos.y = ty; item.rightAngleDeg = tAng;\n        }\n        tickBadge.visible = item.isCorrect;\n        crossBadge.visible = !item.isCorrect;\n        syncRightTransform();\n        renderAnswerGuide(item, tx, ty, tAng);\n\n        if (item.isCorrect) {\n          SoundFX.playCorrect();\n          if (typeof confetti === 'function') confetti({ particleCount: 55, spread: 68, origin: { y: 0.6 } });\n        } else {\n          SoundFX.playWrong();\n        }\n        updateUI();\n      }\n\n      // MODE 1: \"Luat choi\" — Clear visual example on stage + guide card\n      function showRulesExample() {\n        SoundFX.stopMusic();\n        state.mode = 'rules';\n        state.phase = 'finished';\n        state.timeLeft = ROUND_DURATION;\n        document.getElementById('rules-example-card').classList.remove('hidden');\n\n        state.item = {\n          spec: SPECIALTIES[0],\n          leftPos: { x: -2.0, y: 2.0 },\n          leftAngleDeg: 20,\n          rightPos: { x: 2.0, y: -2.0 },\n          rightAngleDeg: 200,\n          isCorrect: true\n        };\n        rebuildBoardItem();\n        tickBadge.visible = true;\n        renderAnswerGuide(state.item, 2.0, -2.0, 200);\n        updateUI();\n      }\n\n      // MODE 2: \"Bat dau\" — 20s Dalat Music + Random Cutout Drag & Touch Rotate\n      function startPlayGame() {\n        state.mode = 'play';\n        document.getElementById('rules-example-card').classList.add('hidden');\n\n        let idx = Math.floor(Math.random() * SPECIALTIES.length);\n        if (idx === state.lastSpecIdx) idx = (idx + 1) % SPECIALTIES.length;\n        state.lastSpecIdx = idx;\n\n        const lx = -(1.15 + Math.random() * 1.55);\n        const lySign = Math.random() < 0.5 ? 1 : -1;\n        const ly = lySign * (1.1 + Math.random() * 1.75);\n        const la = Math.round((Math.random() * 70 - 35) / 5) * 5;\n        const rx = 1.1 + Math.random() * 1.65;\n        const ry = lySign * (0.8 + Math.random() * 1.6);\n        const ra = normalizeAngleDeg(la + (Math.random() < 0.5 ? 40 : -40));\n\n        state.item = {\n          spec: SPECIALTIES[idx],\n          leftPos: { x: lx, y: ly },\n          leftAngleDeg: la,\n          rightPos: { x: rx, y: ry },\n          rightAngleDeg: ra,\n          isCorrect: null\n        };\n        state.timeLeft = ROUND_DURATION;\n        state.phase = 'playing';\n\n        rebuildBoardItem();\n        SoundFX.startDalatMusic20s();\n        updateUI();\n      }\n\n      // =========================================================================\n      // 8. 1-FINGER DRAG + 1-FINGER HANDLE ROTATE (↻) + 2-FINGER TWIST ROTATE\n      // =========================================================================\n      const raycaster = new THREE.Raycaster();\n      const pointerNDC = new THREE.Vector2();\n      const hitPt = new THREE.Vector3();\n      let isDragging = false, isRotating = false, twoFingerAngle = null;\n      const domEl = renderer.domElement;\n\n      function updateRay(cx, cy) {\n        const rect = domEl.getBoundingClientRect();\n        pointerNDC.x = ((cx - rect.left) / rect.width) * 2 - 1;\n        pointerNDC.y = -((cy - rect.top) / rect.height) * 2 + 1;\n        raycaster.setFromCamera(pointerNDC, camera);\n      }\n\n      domEl.addEventListener('pointerdown', (e) => {\n        SoundFX.ensureCtx();\n        if (state.mode !== 'play' || state.phase !== 'playing') return;\n        updateRay(e.clientX, e.clientY);\n        if (rotateHandleMesh && raycaster.intersectObject(rotateHandleMesh, false).length > 0) {\n          isRotating = true;\n          container.classList.add('dragging-card');\n          return;\n        }\n        if (rightStickerMesh && raycaster.intersectObject(rightStickerMesh, false).length > 0) {\n          isDragging = true;\n          container.classList.add('dragging-card');\n        }\n      });\n\n      window.addEventListener('pointermove', (e) => {\n        if (state.mode !== 'play' || state.phase !== 'playing') return;\n        if (isRotating) {\n          updateRay(e.clientX, e.clientY);\n          if (raycaster.ray.intersectPlane(boardDragPlane, hitPt)) {\n            const dx = hitPt.x - state.item.rightPos.x;\n            const dy = (hitPt.y - BOARD_CENTER_Y) - state.item.rightPos.y;\n            state.item.rightAngleDeg = normalizeAngleDeg(THREE.MathUtils.radToDeg(Math.atan2(-dx, dy)));\n            syncRightTransform();\n            updateUI();\n          }\n          return;\n        }\n        if (isDragging) {\n          updateRay(e.clientX, e.clientY);\n          if (raycaster.ray.intersectPlane(boardDragPlane, hitPt)) {\n            state.item.rightPos.x = THREE.MathUtils.clamp(hitPt.x, -BOARD_HALF_W + 0.35, BOARD_HALF_W - 0.35);\n            state.item.rightPos.y = THREE.MathUtils.clamp(hitPt.y - BOARD_CENTER_Y, -BOARD_HALF_H + 0.35, BOARD_HALF_H - 0.35);\n            syncRightTransform();\n          }\n        }\n      });\n\n      window.addEventListener('pointerup', () => {\n        isDragging = false;\n        isRotating = false;\n        container.classList.remove('dragging-card');\n      });\n\n      domEl.addEventListener('touchstart', (e) => {\n        if (e.touches.length === 2 && state.mode === 'play' && state.phase === 'playing') {\n          isDragging = false; isRotating = false;\n          twoFingerAngle = Math.atan2(e.touches[1].clientY - e.touches[0].clientY, e.touches[1].clientX - e.touches[0].clientX);\n        }\n      }, { passive: true });\n      domEl.addEventListener('touchmove', (e) => {\n        if (e.touches.length === 2 && twoFingerAngle !== null && state.mode === 'play' && state.phase === 'playing') {\n          const ang = Math.atan2(e.touches[1].clientY - e.touches[0].clientY, e.touches[1].clientX - e.touches[0].clientX);\n          const delta = -THREE.MathUtils.radToDeg(ang - twoFingerAngle);\n          twoFingerAngle = ang;\n          state.item.rightAngleDeg = normalizeAngleDeg(state.item.rightAngleDeg + delta);\n          syncRightTransform();\n          updateUI();\n        }\n      }, { passive: true });\n      domEl.addEventListener('touchend', (e) => { if (e.touches.length < 2) twoFingerAngle = null; }, { passive: true });\n\n      function rotateBy(deg) {\n        if (state.mode !== 'play' || state.phase !== 'playing') return;\n        state.item.rightAngleDeg = normalizeAngleDeg(state.item.rightAngleDeg + deg);\n        syncRightTransform();\n        updateUI();\n      }\n\n      // =========================================================================\n      // 9. NAME MODAL (VIETNAMESE WITHOUT DIACRITICS) & BUTTON LISTENERS\n      // =========================================================================\n      const nameModal = document.getElementById('name-modal');\n      const nameInput = document.getElementById('input-player-name');\n      const nameError = document.getElementById('name-error');\n\n      function openNameModal(startAfter) {\n        nameInput.value = state.hasEnteredName ? state.playerName : '';\n        nameError.classList.add('hidden');\n        nameModal.dataset.startAfter = startAfter ? '1' : '0';\n        nameModal.classList.remove('hidden');\n        nameModal.classList.add('flex');\n        setTimeout(() => nameInput.focus(), 80);\n      }\n\n      function closeNameModal() {\n        nameModal.classList.add('hidden');\n        nameModal.classList.remove('flex');\n      }\n\n      function submitName() {\n        const clean = (nameInput.value || '').trim().slice(0, 18);\n        if (!clean) {\n          nameError.classList.remove('hidden');\n          nameInput.focus();\n          return;\n        }\n        nameError.classList.add('hidden');\n        state.playerName = clean;\n        state.hasEnteredName = true;\n        document.getElementById('lbl-player-badge').textContent = clean;\n        const shouldStart = nameModal.dataset.startAfter === '1';\n        closeNameModal();\n        if (shouldStart) startPlayGame();\n      }\n\n      document.getElementById('btn-edit-name').addEventListener('click', () => openNameModal(false));\n      document.getElementById('btn-close-name').addEventListener('click', closeNameModal);\n      document.getElementById('btn-save-name').addEventListener('click', submitName);\n      nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitName(); });\n      nameModal.addEventListener('click', (e) => { if (e.target === nameModal) closeNameModal(); });\n\n      document.getElementById('btn-hide-rules-card').addEventListener('click', () => {\n        document.getElementById('rules-example-card').classList.add('hidden');\n      });\n\n      document.getElementById('btn-rules').addEventListener('click', () => showRulesExample());\n      document.getElementById('btn-play').addEventListener('click', () => {\n        if (!state.hasEnteredName) openNameModal(true);\n        else startPlayGame();\n      });\n      document.getElementById('btn-check-now').addEventListener('click', () => {\n        if (state.mode === 'play' && state.phase === 'playing') evaluateResults();\n      });\n\n      document.getElementById('rot-left').addEventListener('click', () => rotateBy(15));\n      document.getElementById('rot-180').addEventListener('click', () => rotateBy(180));\n      document.getElementById('rot-right').addEventListener('click', () => rotateBy(-15));\n\n      document.getElementById('btn-toggle-dashed').addEventListener('click', (e) => {\n        state.showDashed = !state.showDashed;\n        dashedGroup.visible = state.showDashed;\n        e.currentTarget.classList.toggle('active', state.showDashed);\n      });\n\n      document.getElementById('btn-sound').addEventListener('click', () => {\n        SoundFX.enabled = !SoundFX.enabled;\n        if (!SoundFX.enabled) SoundFX.stopMusic();\n        document.getElementById('icon-sound').setAttribute('data-lucide', SoundFX.enabled ? 'volume-2' : 'volume-x');\n        if (window.lucide) lucide.createIcons();\n      });\n\n      window.addEventListener('resize', updateFixed2DCamera);\n      if (typeof ResizeObserver !== 'undefined') {\n        new ResizeObserver(updateFixed2DCamera).observe(container);\n      }\n\n      // =========================================================================\n      // 10. ANIMATION LOOP (20s COUNTDOWN + CENTER PULSE)\n      // =========================================================================\n      const clock = new THREE.Clock();\n      let rafId = null;\n\n      function animate() {\n        rafId = requestAnimationFrame(animate);\n        const dt = Math.min(0.05, clock.getDelta());\n        const t = clock.elapsedTime;\n\n        if (state.mode === 'play' && state.phase === 'playing') {\n          state.timeLeft -= dt;\n          if (state.timeLeft <= 0) {\n            state.timeLeft = 0;\n            SoundFX.playTimeUpBell();\n            evaluateResults();\n          } else {\n            document.getElementById('timer-display').textContent = `${state.timeLeft.toFixed(1)}s`;\n            document.getElementById('timer-bar').style.width = `${(state.timeLeft / ROUND_DURATION) * 100}%`;\n          }\n        }\n\n        const ps = 1 + Math.sin(t * 4.5) * 0.12;\n        centerHalo.scale.set(ps, ps, 1);\n\n        renderer.render(scene, camera);\n      }\n\n      window.onload = function () {\n        if (window.lucide) lucide.createIcons();\n        updateFixed2DCamera();\n        if (rafId) cancelAnimationFrame(rafId);\n        animate();\n        showRulesExample();\n      };\n    })();\n  <\/script>\n</body>\n</html>", "quay": "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\" />\n  <title>Phép Quay Đam Săn 3D (Mobile) — Festival Hoa Đà Lạt lần thứ 11</title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n  <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap\" rel=\"stylesheet\" />\n  <script src=\"https://cdn.tailwindcss.com/3.4.17\"><\/script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n  <script src=\"https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js\"><\/script>\n  <script src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js\"><\/script>\n  <style>\n    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n    html, body {\n      margin: 0;\n      padding: 0;\n      width: 100%;\n      height: 100%;\n      overflow: hidden;\n      font-family: 'Inter', system-ui, -apple-system, sans-serif;\n      background: #dbeafe;\n      user-select: none;\n    }\n    #canvas-container {\n      position: fixed;\n      inset: 0;\n      width: 100%;\n      height: 100%;\n      touch-action: none;\n    }\n    .glass {\n      background: rgba(255, 255, 255, 0.92);\n      backdrop-filter: blur(12px);\n      -webkit-backdrop-filter: blur(12px);\n      border: 1px solid rgba(255, 255, 255, 0.82);\n      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);\n    }\n    .cam-btn.active { background: #0f172a; color: #ffffff; }\n    .tab-btn-rules.active {\n      background: linear-gradient(135deg, #db2777, #9333ea);\n      color: #ffffff;\n      border-color: transparent;\n      box-shadow: 0 4px 12px rgba(219, 39, 119, 0.3);\n    }\n    .tab-btn-play.active {\n      background: linear-gradient(135deg, #059669, #0d9488);\n      color: #ffffff;\n      border-color: transparent;\n      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.32);\n    }\n    @keyframes sunPulse {\n      0%, 100% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.6); }\n      50% { box-shadow: 0 0 0 9px rgba(234, 88, 12, 0); }\n    }\n    .sun-pulse { animation: sunPulse 1.6s infinite; }\n  </style>\n</head>\n<body>\n  <!-- Fullscreen 3D Viewport -->\n  <div id=\"canvas-container\" aria-label=\"Mô phỏng 3D Phép Quay Chàng Đam Săn bản Mobile\"></div>\n\n  <!-- Minimal Top Bar -->\n  <header class=\"fixed top-2.5 left-2.5 right-2.5 z-20 flex items-center justify-between gap-2 pointer-events-none\">\n    <button id=\"btn-edit-name\" class=\"glass pointer-events-auto flex items-center gap-2 px-2.5 py-1.5 rounded-xl active:scale-[0.98] transition-transform\" title=\"Đổi tên người chơi\">\n      <span class=\"w-6 h-6 rounded-lg bg-gradient-to-br from-orange-500 to-rose-600 text-white font-extrabold text-[10px] flex items-center justify-center shrink-0\">VLT</span>\n      <span id=\"lbl-player-badge\" class=\"text-xs font-extrabold text-slate-800 tracking-tight max-w-[135px] truncate\">Đam Săn</span>\n      <i data-lucide=\"pencil\" class=\"w-3.5 h-3.5 text-orange-600 shrink-0\"></i>\n    </button>\n\n    <div class=\"glass pointer-events-auto flex items-center gap-1 p-1 rounded-xl\">\n      <button id=\"cam-room\" class=\"cam-btn active px-2 py-1 rounded-lg text-[11px] font-bold text-slate-700\">3D</button>\n      <button id=\"cam-top\" class=\"cam-btn px-2 py-1 rounded-lg text-[11px] font-bold text-slate-700\">Trên</button>\n      <button id=\"btn-sound\" class=\"p-1 rounded-lg text-slate-700 hover:bg-slate-100\" aria-label=\"Âm thanh\">\n        <i id=\"icon-sound\" data-lucide=\"volume-2\" class=\"w-4 h-4\"></i>\n      </button>\n    </div>\n  </header>\n\n  <!-- Compact Floating Feedback / Encouragement Toast above bottom dock -->\n  <div id=\"toast-wrap\" class=\"fixed bottom-[112px] left-2.5 right-2.5 z-20 flex justify-center pointer-events-none\">\n    <div id=\"feedback-toast\" class=\"hidden glass pointer-events-auto max-w-md w-full rounded-2xl px-3 py-2 text-[11px] font-bold text-center shadow-lg\"></div>\n  </div>\n\n  <!-- Rules & Example Card (visible in \"Luật chơi\" mode) -->\n  <div id=\"rules-card\" class=\"fixed bottom-[112px] left-2.5 right-2.5 z-20 flex justify-center pointer-events-none\">\n    <div class=\"glass pointer-events-auto w-full max-w-md rounded-2xl p-3 space-y-1.5 text-[11px] leading-snug text-slate-700 border border-orange-200\">\n      <div class=\"flex items-center justify-between\">\n        <span class=\"font-extrabold text-orange-700 flex items-center gap-1.5\">\n          <i data-lucide=\"sun\" class=\"w-3.5 h-3.5\"></i>\n          Luật chơi: Đam Săn Tìm Nữ Thần Mặt Trời\n        </span>\n        <button id=\"btn-hide-rules\" class=\"p-0.5 rounded-md hover:bg-slate-200/70 text-slate-500\" aria-label=\"Ẩn luật chơi\">\n          <i data-lucide=\"x\" class=\"w-3.5 h-3.5\"></i>\n        </button>\n      </div>\n      <div>• Vòng tròn (O; R = 1) chia <strong>12 mốc cách đều 30°</strong> (không ghi số độ).</div>\n      <div>• Bấm vào <strong>Ngọn Núi ⛰</strong> góc phải bảng (hoặc nút <strong>Quay</strong>) để nổi nhạc hùng tráng và nhận lệnh <strong>Q(O; φ)</strong> trong <strong>15 giây</strong> (+φ ngược chiều kim đồng hồ, −φ cùng chiều).</div>\n      <div>• Ban đêm Rừng Sáp Đen đông cứng. Tránh <strong>2 thú dữ (🐯, 🐺)</strong> và hoàn thành trong <strong>15s</strong> — nếu Mặt Trời mọc lên sau núi, Rừng Sáp Đen nhão ra khiến Đam Săn bị lún!</div>\n    </div>\n  </div>\n\n  <!-- All-in-One Compact Bottom Mobile Dock -->\n  <footer class=\"fixed bottom-2.5 left-2.5 right-2.5 z-20 flex justify-center pointer-events-none\">\n    <div class=\"glass pointer-events-auto w-full max-w-md rounded-2xl p-2.5 space-y-2\">\n      <!-- Row 1: 15s Sunset Timer + Current Rotation Command -->\n      <div class=\"flex items-center justify-between gap-1.5 text-[11px] font-bold\">\n        <div class=\"flex items-center gap-1.5 px-2 py-1 rounded-lg bg-slate-900 text-white shrink-0\">\n          <span id=\"timer-dot\" class=\"w-2 h-2 rounded-full bg-orange-400\"></span>\n          <span id=\"timer-display\" class=\"tabular-nums font-extrabold\">15.0s</span>\n          <div class=\"w-10 h-1.5 bg-slate-700 rounded-full overflow-hidden\">\n            <div id=\"timer-bar\" class=\"h-full bg-gradient-to-r from-rose-500 via-orange-500 to-amber-300\" style=\"width:100%;\"></div>\n          </div>\n        </div>\n        <span id=\"pill-rule\" class=\"px-2 py-1 rounded-lg bg-orange-50 text-orange-900 border border-orange-200 truncate flex-1 text-center font-extrabold\">\n          ⛰ Bấm Ngọn Núi!\n        </span>\n        <span id=\"pill-steps\" class=\"px-2 py-1 rounded-lg bg-slate-100 text-slate-700 shrink-0\">\n          0 bước\n        </span>\n      </div>\n\n      <!-- Row 2: Main thumb-friendly buttons (\"Luật chơi\", \"Bắt đầu\", \"☀\") -->\n      <div class=\"flex items-center gap-1.5\">\n        <button id=\"btn-rules\" class=\"tab-btn-rules active flex-1 py-2.5 px-2.5 rounded-xl border border-slate-200 bg-white text-slate-700 font-extrabold text-xs transition-all active:scale-[0.98] flex items-center justify-center gap-1.5\">\n          <i data-lucide=\"book-open\" class=\"w-4 h-4\"></i>\n          <span>Luật chơi</span>\n        </button>\n        <button id=\"btn-play\" class=\"tab-btn-play flex-1 py-2.5 px-2.5 rounded-xl border border-slate-200 bg-white text-slate-700 font-extrabold text-xs transition-all active:scale-[0.98] flex items-center justify-center gap-1.5\">\n          <i data-lucide=\"play\" class=\"w-4 h-4\"></i>\n          <span id=\"lbl-play\">Bắt đầu</span>\n        </button>\n        <button id=\"btn-click-sun\" class=\"sun-pulse py-2.5 px-3 rounded-xl bg-gradient-to-r from-orange-500 to-rose-600 text-white font-extrabold text-xs shadow-md active:scale-[0.96] flex items-center justify-center gap-1\" title=\"Bấm Ngọn Núi nhận lệnh quay\">\n          <i data-lucide=\"sun\" class=\"w-4 h-4\"></i>\n          <span>Quay</span>\n        </button>\n      </div>\n    </div>\n  </footer>\n\n  <!-- Player Name Modal -->\n  <div id=\"name-modal\" class=\"fixed inset-0 z-40 hidden items-center justify-center bg-slate-900/55 backdrop-blur-sm p-4\">\n    <div class=\"bg-white rounded-3xl max-w-xs w-full p-5 shadow-2xl space-y-3\">\n      <div class=\"flex items-center justify-between\">\n        <h3 class=\"text-sm font-extrabold text-slate-800 flex items-center gap-2\">\n          <span class=\"w-7 h-7 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center\">\n            <i data-lucide=\"user-round\" class=\"w-4 h-4\"></i>\n          </span>\n          Nhập tên người chơi\n        </h3>\n        <button id=\"btn-close-name\" class=\"p-1 rounded-lg hover:bg-slate-100 text-slate-500\" aria-label=\"Đóng\">\n          <i data-lucide=\"x\" class=\"w-4 h-4\"></i>\n        </button>\n      </div>\n      <div class=\"space-y-1.5\">\n        <input id=\"input-player-name\" type=\"text\" maxlength=\"1
