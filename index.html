ate.mode === 'play' && (state.phase === 'won' || state.phase === 'lost')) ? 'Chơi lại' : 'Bắt đầu';\n\n        const pr = document.getElementById('pill-rule');\n        const sunBtn = document.getElementById('btn-click-sun');\n        if (state.activePhi !== null) {\n          const sign = state.activePhi > 0 ? '+' : '';\n          pr.textContent = `☀ Q(O; ${sign}${state.activePhi}°)`;\n          sunBtn.classList.remove('sun-pulse');\n        } else {\n          pr.textContent = '⛰ Bấm Ngọn Núi!';\n          sunBtn.classList.toggle('sun-pulse', state.mode === 'play' && state.phase === 'need_sun');\n        }\n      }\n\n      function resetStageState() {\n        SoundFX.stopEpicMusic();\n        activeAnim = null;\n        clearArc();\n        hideToast();\n        document.getElementById('win-modal').classList.add('hidden');\n        document.getElementById('win-modal').classList.remove('flex');\n        document.getElementById('lose-modal').classList.add('hidden');\n        document.getElementById('lose-modal').classList.remove('flex');\n        damsanChar.userData.tickBadge.visible = false;\n        damsanChar.userData.crossBadge.visible = false;\n\n        const startIdx = Math.floor(Math.random() * ANGLES.length);\n        const offset = 3 + Math.floor(Math.random() * 6);\n        state.damsanDeg = ANGLES[startIdx];\n        state.goddessDeg = ANGLES[(startIdx + offset) % ANGLES.length];\n\n        const avail = ANGLES.filter(a => a !== state.damsanDeg && a !== state.goddessDeg);\n        const b1 = avail[Math.floor(Math.random() * avail.length)];\n        const avail2 = avail.filter(a => a !== b1 && Math.abs(a - b1) >= 60);\n        const b2 = avail2[Math.floor(Math.random() * avail2.length)];\n        state.beastDegs = [b1, b2];\n\n        state.activePhi = null;\n        state.steps = 0;\n        state.firstSafeEncouraged = false;\n        state.timeLeft = 15.0;\n        state.sunsetProgress = 0;\n        state.phase = 'need_sun';\n\n        sunGroup.position.set(5.4, SUN_START_Y, -6.7);\n        sunGroup.visible = true;\n        scene.background.setHex(0x0b1126);\n        scene.fog.color.setHex(0x0b1126);\n        sunDirLight.intensity = 0.75;\n        hemiLight.intensity = 0.72;\n        waxFloorMat.color.setHex(0x1c1917);\n        waxArenaMat.color.setHex(0x26211e);\n        waxArenaMat.roughness = 0.65;\n        damsanChar.position.y = 0;\n\n        damsanChar.position.copy(angleToWorld(state.damsanDeg));\n        goddessChar.position.copy(angleToWorld(state.goddessDeg));\n        damsanChar.lookAt(0, 0, 0); goddessChar.lookAt(0, 0, 0);\n        state.beastDegs.forEach((bd, i) => {\n          beastChars[i].position.copy(angleToWorld(bd));\n          beastChars[i].lookAt(0, 0, 0);\n        });\n        highlightNodes();\n        updateChalkboard();\n        updateUI();\n      }\n\n      function showRulesMode() {\n        state.mode = 'rules';\n        resetStageState();\n        document.getElementById('rules-card').classList.remove('hidden');\n        updateUI();\n      }\n\n      function startPlayMode() {\n        state.mode = 'play';\n        document.getElementById('rules-card').classList.add('hidden');\n        resetStageState();\n        showToast('Bấm vào Ngọn Núi ⛰ góc phải (hoặc nút Quay) để nhận lệnh phép quay!', 'info');\n        updateUI();\n      }\n\n      function triggerSunOracle() {\n        if (state.mode !== 'play') {\n          if (!state.hasEnteredName) { openNameModal(true); return; }\n          startPlayMode();\n        }\n        if (state.phase !== 'need_sun') return;\n        damsanChar.userData.tickBadge.visible = false;\n        damsanChar.userData.crossBadge.visible = false;\n        clearArc();\n\n        let diff = normDeg(state.goddessDeg - state.damsanDeg);\n        if (diff > 180) diff -= 360;\n        const pool = [30, 60, 90, 120, -30, -60, -90, -120];\n        const chosen = (Math.abs(diff) <= 120 && diff !== 0 && Math.random() < 0.52) ? diff : pool[Math.floor(Math.random() * pool.length)];\n\n        state.activePhi = chosen;\n        state.timeLeft = 15.0;\n        state.sunsetProgress = 0;\n        state.phase = 'awaiting_move';\n        SoundFX.startEpicMusic15s();\n\n        const sign = chosen > 0 ? '+' : '';\n        const dirTxt = chosen > 0 ? 'ngược chiều KĐH' : 'cùng chiều KĐH';\n        showToast(`☀ Quay Q(O; ${sign}${chosen}°) (${dirTxt} ${Math.abs(chosen)}°) — Chạm mốc trên vòng tròn trong 15s!`, 'info');\n        updateChalkboard(`Thực hiện Q(O; ${sign}${chosen}°) (${dirTxt}) trong 15 giây!`);\n        updateUI();\n      }\n\n      function handleNodeTap(targetDeg) {\n        if (state.mode !== 'play' || state.phase !== 'awaiting_move' || state.activePhi === null) return;\n        const expected = normDeg(state.damsanDeg + state.activePhi);\n        const ok = (targetDeg === expected);\n        state.phase = 'rotating';\n\n        let delta = state.activePhi;\n        if (!ok) {\n          let d = normDeg(targetDeg - state.damsanDeg);\n          if (d > 180) d -= 360;\n          delta = d === 0 ? 30 : d;\n        }\n        const startDeg = state.damsanDeg;\n        drawArc(startDeg, delta, ok ? 0x10b981 : 0xef4444);\n\n        activeAnim = {\n          t: 0, dur: 0.85, startDeg, delta,\n          onDone: () => {\n            if (ok) {\n              SoundFX.stopEpicMusic();\n              state.steps++;\n              state.damsanDeg = expected;\n              damsanChar.position.copy(angleToWorld(state.damsanDeg));\n              damsanChar.userData.tickBadge.visible = true;\n              highlightNodes();\n\n              if (state.damsanDeg === state.goddessDeg) {\n                state.phase = 'won'; state.activePhi = null;\n                const mp = angleToWorld(state.goddessDeg);\n                damsanChar.position.set(mp.x - 0.36, 0, mp.z + 0.18);\n                goddessChar.position.set(mp.x + 0.36, 0, mp.z - 0.18);\n                SoundFX.playVictory();\n                if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 75, origin: { y: 0.55 } });\n                document.getElementById('win-summary').textContent = `${state.playerName} (Đam Săn) đã gặp được Nữ thần Mặt Trời sau ${state.steps} bước quay chính xác!`;\n                const wm = document.getElementById('win-modal'); wm.classList.remove('hidden'); wm.classList.add('flex');\n              } else if (state.beastDegs.includes(state.damsanDeg)) {\n                state.phase = 'lost'; state.activePhi = null;\n                damsanChar.userData.tickBadge.visible = false;\n                damsanChar.userData.crossBadge.visible = true;\n                SoundFX.playWrong();\n                document.getElementById('lose-icon').textContent = '🐯';\n                document.getElementById('lose-title').textContent = 'Chia Buồn Cùng Chàng Đam Săn! 😢';\n                document.getElementById('lose-summary').textContent = `${state.playerName} (Đam Săn) vừa đụng phải thú dữ trên vòng tròn! Hãy thử lại hành trình mới nhé!`;\n                const lm = document.getElementById('lose-modal'); lm.classList.remove('hidden'); lm.classList.add('flex');\n              } else {\n                sunGroup.position.y = SUN_START_Y;\n                scene.background.setHex(0x0b1126);\n                scene.fog.color.setHex(0x0b1126);\n                state.phase = 'need_sun'; state.activePhi = null;\n                SoundFX.playCorrect();\n                if (!state.firstSafeEncouraged) {\n                  state.firstSafeEncouraged = true;\n                  showToast(`💪 Cố lên ${state.playerName}! Bước đầu né thú dữ quá giỏi — bấm Ngọn Núi ⛰ đi tiếp!`, 'success');\n                  updateChalkboard(`💪 Cố lên ${state.playerName}! Bước đầu an toàn, bấm Ngọn Núi đi tiếp!`);\n                } else {\n                  showToast('✓ Chính xác! Bấm tiếp Ngọn Núi ⛰ để tiến gần Nữ thần!', 'success');\n                  updateChalkboard('✓ Chính xác! Bấm Ngọn Núi ⛰ để đi tiếp!');\n                }\n              }\n              updateUI();\n            } else {\n              damsanChar.userData.crossBadge.visible = true;\n              SoundFX.playWrong();\n              const sign = state.activePhi > 0 ? '+' : '';\n              showToast(`✗ Chưa đúng! Hãy đếm lại Q(O; ${sign}${state.activePhi}°) (mỗi mốc 30°)!`, 'error');\n              damsanChar.position.copy(angleToWorld(startDeg));\n              state.phase = 'awaiting_move';\n              updateUI();\n            }\n          }\n        };\n      }\n\n      // =========================================================================\n      // 9. TOUCH ORBIT + TAP SUN / TAP CIRCLE NODES\n      // =========================================================================\n      const raycaster = new THREE.Raycaster(), pointerNDC = new THREE.Vector2();\n      const domEl = renderer.domElement;\n\n      function updateRay(cx, cy) {\n        const rect = domEl.getBoundingClientRect();\n        pointerNDC.x = ((cx - rect.left) / rect.width) * 2 - 1;\n        pointerNDC.y = -((cy - rect.top) / rect.height) * 2 + 1;\n        raycaster.setFromCamera(pointerNDC, camera);\n      }\n\n      domEl.addEventListener('pointerdown', (e) => {\n        SoundFX.ensureCtx();\n        orbit.isDragging = true; orbit.lastPos = { x: e.clientX, y: e.clientY }; orbit.movedDist = 0;\n      });\n      window.addEventListener('pointermove', (e) => {\n        if (!orbit.isDragging) return;\n        const dx = e.clientX - orbit.lastPos.x, dy = e.clientY - orbit.lastPos.y;\n        orbit.movedDist += Math.hypot(dx, dy); orbit.lastPos = { x: e.clientX, y: e.clientY };\n        orbit.desiredTheta -= dx * 0.007;\n        orbit.desiredPhi = THREE.MathUtils.clamp(orbit.desiredPhi - dy * 0.007, 0.08, 1.38);\n      });\n      window.addEventListener('pointerup', (e) => {\n        if (!orbit.isDragging) return;\n        orbit.isDragging = false;\n        if (orbit.movedDist < 10) {\n          updateRay(e.clientX, e.clientY);\n          if (raycaster.intersectObject(mtnHitMesh, false).length > 0) { triggerSunOracle(); return; }\n          const hits = raycaster.intersectObjects(nodeHitMeshes, false);\n          if (hits.length > 0) handleNodeTap(hits[0].object.userData.deg);\n        }\n      });\n\n      domEl.addEventListener('touchstart', (e) => {\n        if (e.touches.length === 2) {\n          orbit.isDragging = false;\n          orbit.pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);\n        }\n      }, { passive: true });\n      domEl.addEventListener('touchmove', (e) => {\n        if (e.touches.length === 2) {\n          const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);\n          orbit.desiredRadius = THREE.MathUtils.clamp(orbit.desiredRadius + (orbit.pinchDist - d) * 0.05, 10, 28);\n          orbit.pinchDist = d;\n        }\n      }, { passive: true });\n\n      // =========================================================================\n      // 10. NAME MODAL & BUTTONS\n      // =========================================================================\n      const nameModal = document.getElementById('name-modal');\n      const nameInput = document.getElementById('input-player-name');\n      const nameError = document.getElementById('name-error');\n\n      function openNameModal(startAfter) {\n        nameInput.value = state.hasEnteredName ? state.playerName : '';\n        nameError.classList.add('hidden');\n        nameModal.dataset.startAfter = startAfter ? '1' : '0';\n        nameModal.classList.remove('hidden'); nameModal.classList.add('flex');\n        setTimeout(() => nameInput.focus(), 80);\n      }\n      function closeNameModal() { nameModal.classList.add('hidden'); nameModal.classList.remove('flex'); }\n      function submitName() {\n        const clean = (nameInput.value || '').trim().slice(0, 16);\n        if (!clean) { nameError.classList.remove('hidden'); nameInput.focus(); return; }\n        state.playerName = clean; state.hasEnteredName = true;\n        document.getElementById('lbl-player-badge').textContent = clean;\n        if (damsanChar.userData.nameTag) {\n          damsanChar.userData.pivot.remove(damsanChar.userData.nameTag);\n          const tag = makeSpriteLabel(`Đam Săn (${clean})`, '#be123c', 0.9);\n          tag.position.set(0, 2.55, 0);\n          damsanChar.userData.pivot.add(tag);\n          damsanChar.userData.nameTag = tag;\n        }\n        const go = nameModal.dataset.startAfter === '1';\n        closeNameModal();\n        if (go) startPlayMode();\n      }\n\n      document.getElementById('btn-edit-name').addEventListener('click', () => openNameModal(false));\n      document.getElementById('btn-close-name').addEventListener('click', closeNameModal);\n      document.getElementById('btn-save-name').addEventListener('click', submitName);\n      nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitName(); });\n      nameModal.addEventListener('click', (e) => { if (e.target === nameModal) closeNameModal(); });\n      document.getElementById('btn-hide-rules').addEventListener('click', () => document.getElementById('rules-card').classList.add('hidden'));\n\n      document.getElementById('btn-rules').addEventListener('click', () => showRulesMode());\n      document.getElementById('btn-play').addEventListener('click', () => {\n        if (!state.hasEnteredName) openNameModal(true); else startPlayMode();\n      });\n      document.getElementById('btn-click-sun').addEventListener('click', () => triggerSunOracle());\n      document.getElementById('btn-win-restart').addEventListener('click', () => startPlayMode());\n      document.getElementById('btn-lose-restart').addEventListener('click', () => startPlayMode());\n\n      document.getElementById('cam-room').addEventListener('click', () => applyCameraPreset('room'));\n      document.getElementById('cam-top').addEventListener('click', () => applyCameraPreset('top'));\n      document.getElementById('btn-sound').addEventListener('click', () => {\n        SoundFX.enabled = !SoundFX.enabled;\n        if (!SoundFX.enabled) SoundFX.stopEpicMusic();\n        document.getElementById('icon-sound').setAttribute('data-lucide', SoundFX.enabled ? 'volume-2' : 'volume-x');\n        if (window.lucide) lucide.createIcons();\n      });\n\n      window.addEventListener('resize', () => {\n        camera.aspect = window.innerWidth / window.innerHeight;\n        camera.updateProjectionMatrix();\n        renderer.setSize(window.innerWidth, window.innerHeight);\n      });\n\n      // =========================================================================\n      // 11. MAIN ANIMATION LOOP (15s COUNTDOWN + DRAMATIC 3D SUNSET)\n      // =========================================================================\n      const clock = new THREE.Clock();\n      let rafId = null;\n\n      function animate() {\n        rafId = requestAnimationFrame(animate);\n        const dt = Math.min(0.05, clock.getDelta());\n        const t = clock.elapsedTime;\n\n        if (state.mode === 'play' && state.phase === 'awaiting_move') {\n          state.timeLeft -= dt;\n          if (state.timeLeft <= 0) {\n            state.timeLeft = 0; state.phase = 'sun_setting'; state.sunsetProgress = 0;\n            SoundFX.playSunset();\n            showToast('🌅 Mặt Trời đã mọc! Rừng Sáp Đen nhão ra, chàng Đam Săn bị lún xuống!', 'error');\n            updateChalkboard('🌅 MẶT TRỜI ĐÃ MỌC! Rừng Sáp Đen nhão ra, Đam Săn bị lún!');\n            updateUI();\n          } else {\n            const frac = 1 - (state.timeLeft / 15);\n            sunGroup.position.y = SUN_START_Y + frac * 3.15;\n            const dawn = new THREE.Color(0x0b1126).lerp(new THREE.Color(0x3b1d2e), frac * 0.65);\n            scene.background.copy(dawn); scene.fog.color.copy(dawn);\n            document.getElementById('timer-display').textContent = `${state.timeLeft.toFixed(1)}s`;\n            document.getElementById('timer-bar').style.width = `${(state.timeLeft / 15) * 100}%`;\n          }\n        } else if (state.phase === 'sun_setting') {\n          state.sunsetProgress = Math.min(1, state.sunsetProgress + dt * 0.65);\n          const p = state.sunsetProgress;\n          sunGroup.position.y = THREE.MathUtils.lerp(SUN_START_Y + 3.15, 5.7, p);\n          sunDirLight.intensity = THREE.MathUtils.lerp(0.75, 1.45, p);\n          hemiLight.intensity = THREE.MathUtils.lerp(0.72, 1.0, p);\n          const sky = new THREE.Color(0x3b1d2e).lerp(new THREE.Color(0xfdba74), p);\n          scene.background.copy(sky); scene.fog.color.copy(sky);\n\n          waxArenaMat.roughness = THREE.MathUtils.lerp(0.65, 0.12, p);\n          waxArenaMat.color.lerpColors(new THREE.Color(0x26211e), new THREE.Color(0x140f0c), p);\n          damsanChar.position.y = THREE.MathUtils.lerp(0, -1.18, p);\n\n          if (p >= 1) {\n            state.phase = 'lost';\n            document.getElementById('lose-icon').textContent = '🌅';\n            document.getElementById('lose-title').textContent = 'Mặt Trời Đã Mọc — Rừng Sáp Đen Nhão Ra! 😢';\n            document.getElementById('lose-summary').textContent = `Hết 15 giây! Mặt Trời mọc lên sau núi làm Rừng Sáp Đen chảy nhão và ${state.playerName} (Đam Săn) bị lún xuống! Hãy thử lại đêm hành trình mới nhé!`;\n            const lm = document.getElementById('lose-modal'); lm.classList.remove('hidden'); lm.classList.add('flex');\n            updateUI();\n          }\n        }\n\n        sunRaysGroup.rotation.z = t * 0.48;\n        const ss = (state.mode === 'play' && state.phase === 'need_sun') ? 1 + Math.sin(t * 4.5) * 0.08 : 1;\n        sunGroup.scale.setScalar(ss);\n\n        goddessChar.userData.crownGroup.rotation.z = -t * 0.75;\n        goddessChar.userData.pivot.position.y = Math.sin(t * 3.0) * 0.05;\n        const gs = 1 + Math.sin(t * 4.0) * 0.1;\n        goddessChar.userData.auraRing1.scale.set(gs, gs, 1);\n\n        beastChars.forEach((b, i) => {\n          b.userData.pivot.position.y = Math.abs(Math.sin(t * 3.8 + i * 1.4)) * 0.08;\n          const ds = 1 + Math.sin(t * 5 + i) * 0.09;\n          b.userData.dangerRing.scale.set(ds, ds, 1);\n        });\n\n        if (activeAnim) {\n          activeAnim.t += dt;\n          const p = Math.min(1, activeAnim.t / activeAnim.dur);\n          const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;\n          const pos = angleToWorld(activeAnim.startDeg + activeAnim.delta * ease);\n          damsanChar.position.set(pos.x, 0, pos.z);\n          damsanChar.userData.pivot.position.y = Math.sin(p * Math.PI) * 0.55;\n          damsanChar.lookAt(0, 0, 0);\n          if (p >= 1) {\n            damsanChar.userData.pivot.position.y = 0;\n            const cb = activeAnim.onDone; activeAnim = null; if (cb) cb();\n          }\n        }\n\n        updateCamera(dt);\n        renderer.render(scene, camera);\n      }\n\n      window.onload = function () {\n        if (window.lucide) lucide.createIcons();\n        applyCameraPreset('room');\n        orbit.theta = orbit.desiredTheta;\n        orbit.phi = orbit.desiredPhi;\n        orbit.radius = orbit.desiredRadius;\n        orbit.target.copy(orbit.desiredTarget);\n        updateCamera(1);\n\n        if (rafId) cancelAnimationFrame(rafId);\n        animate();\n        showRulesMode();\n      };\n    })();\n  <\/script>\n</body>\n</html>"};
      const frame = document.getElementById('sim-frame');
      let currentKey = 'tinhtien';

      function loadTab(key) {
        if (!SIM_SOURCES[key]) return;

        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-key') === key);

        frame.srcdoc = SIM_SOURCES[key];
      }

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => loadTab(btn.getAttribute('data-key')));

        loadTab(currentKey);
