hadow-md active:scale-[0.98]\">\n        Vào chơi ngay!\n      </button>\n    </div>\n  </div>\n\n  <script>\n    (function () {\n      'use strict';\n\n      // =========================================================================\n      // 1. AUDIO SYNTHESIZER (Web Audio API)\n      // =========================================================================\n      const SoundFX = {\n        ctx: null,\n        enabled: true,\n        festivalNodes: [],\n        ensureCtx() {\n          if (!this.enabled) return null;\n          if (!this.ctx) {\n            const AudioCtx = window.AudioContext || window.webkitAudioContext;\n            if (AudioCtx) this.ctx = new AudioCtx();\n          }\n          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});\n          return this.ctx;\n        },\n        playJump() {\n          const ctx = this.ensureCtx();\n          if (!ctx) return;\n          const now = ctx.currentTime;\n          const osc = ctx.createOscillator(), gain = ctx.createGain();\n          osc.type = 'sine';\n          osc.frequency.setValueAtTime(220, now);\n          osc.frequency.exponentialRampToValueAtTime(520, now + 0.18);\n          gain.gain.setValueAtTime(0.13, now);\n          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);\n          osc.connect(gain); gain.connect(ctx.destination);\n          osc.start(now); osc.stop(now + 0.23);\n        },\n        playLand() {\n          const ctx = this.ensureCtx();\n          if (!ctx) return;\n          const now = ctx.currentTime;\n          const osc = ctx.createOscillator(), gain = ctx.createGain();\n          osc.type = 'triangle';\n          osc.frequency.setValueAtTime(160, now);\n          osc.frequency.exponentialRampToValueAtTime(65, now + 0.12);\n          gain.gain.setValueAtTime(0.14, now);\n          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);\n          osc.connect(gain); gain.connect(ctx.destination);\n          osc.start(now); osc.stop(now + 0.15);\n        },\n        playCorrect() {\n          const ctx = this.ensureCtx();\n          if (!ctx) return;\n          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {\n            const now = ctx.currentTime + i * 0.08;\n            const osc = ctx.createOscillator(), gain = ctx.createGain();\n            osc.type = 'sine';\n            osc.frequency.setValueAtTime(freq, now);\n            gain.gain.setValueAtTime(0.12, now);\n            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);\n            osc.connect(gain); gain.connect(ctx.destination);\n            osc.start(now); osc.stop(now + 0.28);\n          });\n        },\n        playWrong() {\n          const ctx = this.ensureCtx();\n          if (!ctx) return;\n          const now = ctx.currentTime;\n          [220, 165].forEach((freq, i) => {\n            const osc = ctx.createOscillator(), gain = ctx.createGain();\n            osc.type = 'sawtooth';\n            osc.frequency.setValueAtTime(freq, now + i * 0.13);\n            gain.gain.setValueAtTime(0.075, now + i * 0.13);\n            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.13 + 0.18);\n            osc.connect(gain); gain.connect(ctx.destination);\n            osc.start(now + i * 0.13); osc.stop(now + i * 0.13 + 0.2);\n          });\n        },\n        playTick() {\n          const ctx = this.ensureCtx();\n          if (!ctx) return;\n          const now = ctx.currentTime;\n          const osc = ctx.createOscillator(), gain = ctx.createGain();\n          osc.type = 'sine';\n          osc.frequency.setValueAtTime(680, now);\n          gain.gain.setValueAtTime(0.04, now);\n          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);\n          osc.connect(gain); gain.connect(ctx.destination);\n          osc.start(now); osc.stop(now + 0.045);\n        },\n        stopFestivalMusic() {\n          this.festivalNodes.forEach(n => { try { n.stop(); } catch (e) {} });\n          this.festivalNodes 0 ? 0.18 : 0.11);\n            if (i % 4 === 2) this.playFestNote(880, t, 0.05, 'square', 0.028); // Crisp festival clap/hi-hat accent\n            if (i % 2 === 0) this.playFestNote(bassSeq[(i / 2) % bassSeq.length], t, 0.2, 'triangle', 0.075);\n          }\n\n          // 2) Cheerful street festival brass/marimba melody (syncopated carnival hook!)\n          const hook = [\n            [523.25,0,1],[659.25,1,1],[783.99,2,1.5],[659.25,3.5,0.5],[783.99,4,1],[880.00,5,1],[783.99,6,2],\n            [698.46,8,1],[659.25,9,1],[587.33,10,1.5],[659.25,11.5,0.5],[523.25,12,2],[392.00,14,2],\n            [523.25,16,1],[659.25,17,1],[783.99,18,1],[1046.5,19,1.5],[880.00,20.5,0.5],[783.99,21,1],[659.25,22,2],\n            [587.33,24,1],[698.46,25,1],[659.25,26,1],[587.33,27,1],[523.25,28,3]\n          ];\n          // Play hook twice to span full 15 seconds (0..30 and 30..60)\n          [0, 30].forEach(offset => {\n            hook.forEach(([f, sIdx, len]) => {\n              if (offset + sIdx < 60) {\n                this.playFestNote(f, (offset + sIdx) * step, len * step * 0.88, 'triangle', 0.11);\n                this.playFestNote(f * 2, (offset + sIdx) * step, len * step * 0.5, 'sine', 0.025);\n              }\n            });\n          });\n        },\n        playTimeUp() {\n          this.stopFestivalMusic();\n          this.playFestNote(784, 0, 0.3, 'sine', 0.12);\n          this.playFestNote(523.25, 0.16, 0.45, 'sine', 0.12);\n        }\n      };\n\n      // =========================================================================\n      // 2. CONSTANTS & STATE\n      // =========================================================================\n      const GRID_MIN = -4;\n      const GRID_MAX = 4;\n      const TILE_STEP = 1.35;\n\n      function oxyToWorld(x, y, h = 0) {\n        return new THREE.Vector3(x * TILE_STEP, h, -y * TILE_STEP);\n      }\n\n      const state = {\n        mode: 'rules',\n        phase: 'idle',\n        playerName: 'Người chơi 1',\n        hasEnteredName: false,\n        score: 0,\n        streak: 0,\n        timeLeft: 15.0,\n\n        A: { x: -3, y: -1 },\n        B: { x: -1, y: 1 },\n        M: { x: 0, y: -2 },\n        M2: { x: 1, y: -3 },\n        P2Wrong: { x: 3, y: -3 },\n        p1Status: 'waiting', // 'waiting' | 'correct' | 'wrong'\n        p2Done: false,\n        showVectors: true,\n        showParallelogram: true\n      };\n\n      function getVector() { return { x: state.B.x - state.A.x, y: state.B.y - state.A.y }; }\n      function getTargetMPrime() { const v = getVector(); return { x: state.M.x + v.x, y: state.M.y + v.y }; }\n\n      // =========================================================================\n      // 3. THREE.JS SCENE SETUP\n      // =========================================================================\n      const container = document.getElementById('canvas-container');\n      const scene = new THREE.Scene();\n      scene.background = new THREE.Color(0x93c5fd);\n      scene.fog = new THREE.Fog(0xbae6fd, 28, 72);\n\n      const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 100);\n\n      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });\n      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));\n      renderer.setSize(window.innerWidth, window.innerHeight);\n      renderer.shadowMap.enabled = true;\n      renderer.shadowMap.type = THREE.PCFSoftShadowMap;\n      renderer.outputEncoding = THREE.sRGBEncoding;\n      renderer.toneMapping = THREE.ACESFilmicToneMapping;\n      renderer.toneMappingExposure = 0.96;\n      container.appendChild(renderer.domElement);\n\n      scene.add(new THREE.HemisphereLight(0xffffff, 0x8c6239, 0.74));\n      const sunLight = new THREE.DirectionalLight(0xfff3db, 0.98);\n      sunLight.position.set(-10, 13, 8);\n      sunLight.castShadow = true;\n      sunLight.shadow.mapSize.width = 1024;\n      sunLight.shadow.mapSize.height = 1024;\n      sunLight.shadow.camera.left = -11.5;\n      sunLight.shadow.camera.right = 11.5;\n      sunLight.shadow.camera.top = 11.5;\n      sunLight.shadow.camera.bottom = -11.5;\n      scene.add(sunLight);\n      const fillLight = new THREE.DirectionalLight(0xc7d2fe, 0.34);\n      fillLight.position.set(9, 7, -6);\n      scene.add(fillLight);\n\n      // =========================================================================\n      // 4. PORTRAIT-OPTIMIZED TOUCH ORBIT CAMERA\n      // =========================================================================\n      const orbit = {\n        target: new THREE.Vector3(0, 0.35, -0.6),\n        desiredTarget: new THREE.Vector3(0, 0.35, -0.6),\n        theta: 0.14,\n        phi: 0.94,\n        radius: 22.8,\n        desiredTheta: 0.14,\n        desiredPhi: 0.94,\n        desiredRadius: 22.8,\n        isDragging: false,\n        lastPos: { x: 0, y: 0 },\n        movedDist: 0,\n        pinchDist: 0\n      };\n\n      function applyCameraPreset(preset) {\n        const isPortrait = window.innerHeight > window.innerWidth;\n        if (preset === 'room') {\n          orbit.desiredTheta = 0.14;\n          orbit.desiredPhi = isPortrait ? 0.94 : 0.92;\n          orbit.desiredRadius = isPortrait ? 22.8 : 16.5;\n          orbit.desiredTarget.set(0, isPortrait ? 0.0 : 0.65, isPortrait ? -0.4 : -0.5);\n        } else if (preset === 'top') {\n          orbit.desiredTheta = 0.0;\n          orbit.desiredPhi = 0.08;\n          orbit.desiredRadius = isPortrait ? 25.5 : 17.5;\n          orbit.desiredTarget.set(0, 0, isPortrait ? 0.8 : 0);\n        }\n        document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));\n        const btn = document.getElementById('cam-' + preset);\n        if (btn) btn.classList.add('active');\n      }\n\n      function updateCamera(dt) {\n        const k = Math.min(1, dt * 7.5);\n        orbit.theta += (orbit.desiredTheta - orbit.theta) * k;\n        orbit.phi += (orbit.desiredPhi - orbit.phi) * k;\n        orbit.radius += (orbit.desiredRadius - orbit.radius) * k;\n        orbit.target.lerp(orbit.desiredTarget, k);\n        const sinPhi = Math.sin(orbit.phi);\n        camera.position.set(\n          orbit.target.x + orbit.radius * sinPhi * Math.sin(orbit.theta),\n          Math.max(1.0, orbit.target.y + orbit.radius * Math.cos(orbit.phi)),\n          orbit.target.z + orbit.radius * sinPhi * Math.cos(orbit.theta)\n        );\n        camera.lookAt(orbit.target);\n      }\n\n      // =========================================================================\n      // 5. TEXTURES: HONEY OAK WOOD, FESTIVAL CHALKBOARD, SPRITES\n      // =========================================================================\n      function createWoodFloorTexture() {\n        const c = document.createElement('canvas');\n        c.width = 512; c.height = 512;\n        const ctx = c.getContext('2d');\n        ctx.fillStyle = '#c9935b';\n        ctx.fillRect(0, 0, 512, 512);\n        const ph = 64;\n        for (let i = 0; i < 8; i++) {\n          const shade = (i % 2 === 0 ? 6 : -6);\n          ctx.fillStyle = `rgb(${198 + shade}, ${146 + shade}, ${92 + shade})`;\n          ctx.fillRect(0, i * ph, 512, ph - 2);\n          ctx.fillStyle = 'rgba(92, 56, 24, 0.26)';\n          ctx.fillRect(0, (i + 1) * ph - 2, 512, 2);\n        }\n        const tex = new THREE.CanvasTexture(c);\n        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;\n        tex.repeat.set(5, 5);\n        tex.encoding = THREE.sRGBEncoding;\n        return tex;\n      }\n\n      const boardCanvas = document.createElement('canvas');\n      boardCanvas.width = 1120; boardCanvas.height = 480;\n      const boardCtx = boardCanvas.getContext('2d');\n      const boardTexture = new THREE.CanvasTexture(boardCanvas);\n      boardTexture.encoding = THREE.sRGBEncoding;\n\n      function updateChalkboard() {\n        const ctx = boardCtx;\n        const grad = ctx.createLinearGradient(0, 0, 1120, 480);\n        grad.addColorStop(0, '#103c2b');\n        grad.addColorStop(1, '#08271b');\n        ctx.fillStyle = grad;\n        ctx.fillRect(0, 0, 1120, 480);\n\n        ctx.strokeStyle = 'rgba(253, 224, 71, 0.45)';\n        ctx.lineWidth = 3;\n        ctx.setLineDash([12, 8]);\n        ctx.strokeRect(18, 18, 1084, 444);\n        ctx.setLineDash([]);\n\n        ctx.fillStyle = '#fde047';\n        ctx.font = '800 44px Inter, sans-serif';\n        ctx.textAlign = 'center';\n        ctx.fillText('CARNIVAL HỒ XUÂN HƯƠNG • ĐÀ LẠT', 560, 78);\n\n        ctx.fillStyle = '#f9a8d4';\n        ctx.font = '800 26px Inter, sans-serif';\n        ctx.fillText(state.mode === 'rules' ? 'LUẬT CHƠI • PHÉP TỊNH TIẾN CARNIVAL' : 'TRÒ CHƠI • CHẠM ĐƯỜNG ĐỂ NHẢY THEO VECTO!', 560, 122);\n\n        const v = getVector();\n        const mp = getTargetMPrime();\n\n        ctx.fillStyle = '#93c5fd';\n        ctx.font = '800 32px Inter, sans-serif';\n        ctx.fillText(`Vecto: A(${state.A.x}; ${state.A.y}) → B(${state.B.x}; ${state.B.y})   |   v = (${v.x}; ${v.y})`, 560, 215);\n\n        ctx.fillStyle = '#6ee7b7';\n        ctx.font = '800 30px Inter, sans-serif';\n        const pName = state.playerName || 'Người chơi 1';\n        ctx.fillText(\n          state.p1Status === 'correct'\n            ? `${pName}: M(${state.M.x}; ${state.M.y}) → M'(${mp.x}; ${mp.y})   ✓ ĐÚNG`\n            : `${pName}: Đứng tại M(${state.M.x}; ${state.M.y}) → M'( ? ; ? )`,\n          560, 295\n        );\n\n        if (state.mode === 'rules') {\n          ctx.fillStyle = '#fca5a5';\n          ctx.font = '800 30px Inter, sans-serif';\n          ctx.fillText(\n            state.p2Done ? `Người chơi 2: N(${state.M2.x}; ${state.M2.y}) → P(${state.P2Wrong.x}; ${state.P2Wrong.y})   ✗ SAI` : `Người chơi 2: N(${state.M2.x}; ${state.M2.y}) → ...`,\n            560, 370\n          );\n        } else {\n          ctx.fillStyle = '#fde68a';\n          ctx.font = '800 28px Inter, sans-serif';\n          ctx.fillText(`Điểm hiện tại: ${state.score}   |   Chuỗi đúng: ${state.streak} 🔥`, 560, 370);\n        }\n\n        boardTexture.needsUpdate = true;\n      }\n\n      function makeSpriteLabel(text, bgColor, scale = 0.92) {\n        const c = document.createElement('canvas');\n        c.width = 320; c.height = 96;\n        const ctx = c.getContext('2d');\n        const r = 24;\n        ctx.fillStyle = bgColor;\n        ctx.beginPath();\n        ctx.moveTo(14 + r, 14); ctx.lineTo(306 - r, 14);\n        ctx.quadraticCurveTo(306, 14, 306, 14 + r); ctx.lineTo(306, 82 - r);\n        ctx.quadraticCurveTo(306, 82, 306 - r, 82); ctx.lineTo(14 + r, 82);\n        ctx.quadraticCurveTo(14, 82, 14, 82 - r); ctx.lineTo(14, 14 + r);\n        ctx.quadraticCurveTo(14, 14, 14 + r, 14); ctx.closePath();\n        ctx.fill();\n        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.stroke();\n        ctx.fillStyle = '#ffffff';\n        ctx.font = '800 34px Inter, sans-serif';\n        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n        ctx.fillText(text, 160, 49);\n        const tex = new THREE.CanvasTexture(c);\n        tex.encoding = THREE.sRGBEncoding;\n        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));\n        sp.scale.set(scale * 2.1, scale * 0.64, 1);\n        sp.renderOrder = 14;\n        return sp;\n      }\n\n      function makeResultBadgeSprite(isCorrect) {\n        const c = document.createElement('canvas');\n        c.width = 256; c.height = 256;\n        const ctx = c.getContext('2d');\n        ctx.beginPath();\n        ctx.arc(128, 128, 108, 0, Math.PI * 2);\n        ctx.fillStyle = isCorrect ? '#10b981' : '#ef4444';\n        ctx.fill();\n        ctx.lineWidth = 14; ctx.strokeStyle = '#ffffff'; ctx.stroke();\n        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 26; ctx.lineCap = 'round'; ctx.lineJoin = 'round';\n        ctx.beginPath();\n        if (isCorrect) { ctx.moveTo(72, 134); ctx.lineTo(112, 174); ctx.lineTo(186, 86); }\n        else { ctx.moveTo(82, 82); ctx.lineTo(174, 174); ctx.moveTo(174, 82); ctx.lineTo(82, 174); }\n        ctx.stroke();\n        const tex = new THREE.CanvasTexture(c);\n        tex.encoding = THREE.sRGBEncoding;\n        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));\n        sp.scale.set(1.3, 1.3, 1);\n        sp.renderOrder = 22;\n        return sp;\n      }\n\n      function makeFloorTickLabel(text, color) {\n        const c = document.createElement('canvas');\n        c.width = 128; c.height = 128;\n        const ctx = c.getContext('2d');\n        ctx.fillStyle = color;\n        ctx.font = '800 72px Inter, sans-serif';\n        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n        ctx.fillText(text, 64, 66);\n        const tex = new THREE.CanvasTexture(c);\n        tex.encoding = THREE.sRGBEncoding;\n        const plane = new THREE.Mesh(\n          new THREE.PlaneGeometry(0.58, 0.58),\n          new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })\n        );\n        plane.rotation.x = -Math.PI / 2;\n        return plane;\n      }\n\n      // =========================================================================\n      // 6. HỒ XUÂN HƯƠNG ĐÀ LẠT + LỄ HỘI CARNIVAL ĐƯỜNG PHỐ!\n      // =========================================================================\n      const roomGroup = new THREE.Group();\n      scene.add(roomGroup);\n\n      // 1) Shimmering Blue Water of Hồ Xuân Hương stretching all around behind the lakeside plaza!\n      const waterMesh = new THREE.Mesh(\n        new THREE.PlaneGeometry(110, 85),\n        new THREE.MeshStandardMaterial({\n          color: 0x0ea5e9,\n          emissive: 0x0369a1,\n          emissiveIntensity: 0.18,\n          roughness: 0.18,\n          metalness: 0.32\n        })\n      );\n      waterMesh.rotation.x = -Math.PI / 2;\n      waterMesh.position.set(0, -0.35, -18);\n      roomGroup.add(waterMesh);\n\n      // Lakeside Stone Promena  8), beakMat);\n        beak.rotation.x = Math.PI / 2; beak.position.set(0, 1.12, 1.26); g.add(beak);\n        roomGroup.add(g);\n        swanBoats.push({ group: g, baseX: x, phase: Math.random() * 6.28 });\n      }\n      createSwanBoat(-5.5, -11.5, 0.55);\n      createSwanBoat(6.2, -13.0, -0.65);\n\n      // 5) Fluffy White Clouds in the Blue Dalat Sky\n      const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });\n      [[-11, 10, -24], [2, 11.5, -28], [13, 9.8, -22]].forEach(([cx, cy, cz]) => {\n        const cg = new THREE.Group(); cg.position.set(cx, cy, cz);\n        [[0,0,0,1.6], [-1.3,-0.2,0,1.1], [1.4,-0.15,0,1.2]].forEach(([ox,oy,oz,r]) => {\n          const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), cloudMat);\n          puff.position.set(ox, oy, oz); cg.add(puff);\n        });\n        roomGroup.add(cg);\n      });\n\n      // 6) Carnival Stage Arch & Festival Billboard on the Lakeside Promenade!\n      const archPillarMat = new THREE.MeshStandardMaterial({ color: 0xe11d48, roughness: 0.45 });\n      const goldTrimMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.35 });\n      [-4.9, 4.9].forEach(px => {\n        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 5.4, 14), archPillarMat);\n        pillar.position.set(px, 2.7, -6.75);\n        roomGroup.add(pillar);\n        const cap = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), goldTrimMat);\n        cap.position.set(px, 5.5, -6.75);\n        roomGroup.add(cap);\n      });\n\n      const boardFrame = new THREE.Mesh(new THREE.BoxGeometry(9.4, 3.6, 0.16), goldTrimMat);\n      boardFrame.position.set(0, 3.8, -6.82);\n      roomGroup.add(boardFrame);\n\n      const boardSurface = new THREE.Mesh(\n        new THREE.PlaneGeometry(9.0, 3.28),\n        new THREE.MeshStandardMaterial({ map: boardTexture, roughness: 0.82 })\n      );\n      boardSurface.position.set(0, 3.8, -6.72);\n      roomGroup.add(boardSurface);\n\n      // Colorful Carnival Bunting Flags & Floral Garland over the Stage Arch!\n      const flowerColors = [0xe11d48, 0xfacc15, 0x2563eb, 0x7c3aed, 0xec4899, 0xf97316, 0x10b981];\n      const leafMatBright = new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.55 });\n      const centerYellowMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 });\n      const petalGeo = new THREE.SphereGeometry(0.13, 8, 8);\n      const ctrGeo = new THREE.SphereGeometry(0.09, 8, 8);\n\n      function createBlossom(hexColor, scale = 1.0) {\n        const g = new THREE.Group();\n        const mat = new THREE.MeshStandardMaterial({ color: hexColor, roughness: 0.45 });\n        for (let i = 0; i < 6; i++) {\n          const ang = (i / 6) * Math.PI * 2;\n          const p = new THREE.Mesh(petalGeo, mat);\n          p.position.set(Math.cos(ang) * 0.14, Math.sin(ang) * 0.14, 0);\n          p.scale.set(1.15, 0.85, 0.55); g.add(p);\n        }\n        const ctr = new THREE.Mesh(ctrGeo, centerYellowMat); ctr.position.z = 0.04; g.add(ctr);\n        g.scale.setScalar(scale); return g;\n      }\n\n      for (let i = 0; i <= 20; i++) {\n        const gx = -4.8 + (i / 20) * 9.6;\n        const gy = 5.7 + Math.sin(i * 0.65) * 0.14;\n        const leaf = new THREE.Mesh(new THREE.DodecahedronGeometry(0.24, 0), leafMatBright);\n        leaf.position.set(gx, gy, -6.68); roomGroup.add(leaf);\n        if (i % 2 === 0) {\n          const fl = createBlossom(flowerColors[i % flowerColors.length], 1.2);\n          fl.position.set(gx, gy, -6.52); roomGroup.add(fl);\n        }\n      }\n\n      // Carnival Balloon Clusters flanking the lakeside stage!\n      [[-6.4, -6.1], [6.4, -6.1]].forEach(([bx, bz], sIdx) => {\n        for (let k = 0; k < 4; k++) {\n          const bCol = flowerColors[(k + sIdx * 3) % flowerColors.length];\n          const bal = new THREE.Mesh(\n            new THREE.SphereGeometry(0.36, 14, 14),\n            new THREE.MeshStandardMaterial({ color: bCol, roughness: 0.25, metalness: 0.1 })\n          );\n          bal.scale.set(1, 1.18, 1);\n          bal.position.set(bx + Math.cos(k * 1.6) * 0.42, 3.2 + k * 0.42, bz + Math.sin(k * 1.6) * 0.35);\n          roomGroup.add(bal);\n        }\n      });\n\n      // =========================================================================\n      // 7. INTERACTIVE ROAD STEPPING DOTS (NO OXY AXES!) + CHEERING DANCERS\n      // =========================================================================\n      const gridGroup = new THREE.Group();\n      scene.add(gridGroup);\n\n      const tileMap = new Map();\n      const tileHitMeshes = [];\n      const padGeo = new THREE.CylinderGeometry(0.26, 0.28, 0.035, 20);\n      const hitGeo = new THREE.CylinderGeometry(0.62, 0.62, 0.1, 14);\n      const hitMat = new THREE.MeshBasicMaterial({ visible: false });\n\n      for (let gx = GRID_MIN; gx <= GRID_MAX; gx++) {\n        for (let gy = GRID_MIN; gy <= GRID_MAX; gy++) {\n          const baseColor = 0x64748b;\n          const pos = oxyToWorld(gx, gy, 0.032);\n          const pad = new THREE.Mesh(padGeo, new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.45 }));\n          pad.position.copy(pos);\n          gridGroup.add(pad);\n\n          const hit = new THREE.Mesh(hitGeo, hitMat);\n          hit.position.copy(pos);\n          hit.userData = { gx, gy };\n          gridGroup.add(hit);\n          tileHitMeshes.push(hit);\n          tileMap.set(`${gx},${gy}`, { pad, baseColor });\n        }\n      }\n\n      // 10 CHEERING CARNIVAL DANCERS LINING BOTH SIDES OF THE PARADE ROAD!\n      const cheeringDancers = [];\n      const crowdPalette = [0xec4899, 0xfacc15, 0x38bdf8, 0xa855f7, 0xf97316, 0x10b981, 0xf43f5e, 0x3b82f6];\n      const crowdSkinMat = new THREE.MeshStandardMaterial({ color: 0xffd5b8, roughness: 0.6 });\n      const crowdHairMat = new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 0.8 });\n\n      function createCheeringDancer(x, z, faceDirX, colorIdx) {\n        const g = new THREE.Group();\n        g.position.set(x, 0.12, z);\n        g.rotation.y = faceDirX > 0 ? Math.PI / 2 : -Math.PI / 2;\n\n        const dressCol = crowdPalette[colorIdx % crowdPalette.length];\n        const pomCol = crowdPalette[(colorIdx + 3) % crowdPalette.length];\n        const dressMat = new THREE.MeshStandardMaterial({ color: dressCol, roughness: 0.45 });\n        const pomMat = new THREE.MeshStandardMaterial({ color: pomCol, emissive: pomCol, emissiveIntensity: 0.25 });\n\n        const pivot = new THREE.Group();\n        g.add(pivot);\n\n        // Skirt / Outfit\n        const skirt = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.82, 12), dressMat);\n        skirt.position.y = 0.56; pivot.add(skirt);\n        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.42, 10), dressMat);\n        torso.position.y = 1.05; pivot.add(torso);\n\n        // Head + Carnival Feather Plume\n        const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), crowdSkinMat);\n        head.position.y = 1.44; pivot.add(head);\n        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.21, 12, 10, 0, Math.PI * 2, 0, Math.PI * 0.55), crowdHairMat);\n        hair.position.y = 1.46; pivot.add(hair);\n        const plume = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.36, 6), pomMat);\n        plume.position.set(0, 1.76, 0); pivot.add(plume);\n\n        // Two Raised Cheering Arms holding Colorful Pom-Poms!\n        function makeCheerArm(side) {\n          const sh = new THREE.Group();\n          sh.position.set(side * 0.23, 1.18, 0);\n          const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.048, 0.42, 8), crowdSkinMat);\n          arm.position.y = 0.18; sh.add(arm);\n          const pom = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), pomMat);\n          pom.position.y = 0.42; sh.add(pom);\n          sh.rotation.z = side * -0.45;\n          return sh;\n        }\n        const armL = makeCheerArm(-1), armR = makeCheerArm(1);\n        pivot.add(armL, armR);\n\n        roomGroup.add(g);\n        cheeringDancers.push({ pivot, armL, armR, phase: colorIdx * 0.9 });\n      }\n\n      // 5 Dancers along Left Sidewalk, 5 Dancers along Right Sidewalk!\n      [-4.6, -2.3, 0.0, 2.3, 4.6].forEach((zPos, idx) => {\n        createCheeringDancer(-(arenaSize / 2 + 1.35), zPos, 1, idx);\n        createCheeringDancer((arenaSize / 2 + 1.35), zPos, -1, idx + 4);\n      });\n\n      // =========================================================================\n      // 8. THREE 3D CHARACTERS IN VIBRANT CARNIVAL FESTIVAL COSTUMES!\n      // =========================================================================\n      function createCharacter(nameText, tagBg, mainCol, accentCol, featherPalette) {\n        const root = new THREE.Group();\n        const bodyPivot = new THREE.Group();\n        root.add(bodyPivot);\n\n        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd5b8, roughness: 0.6 });\n        const mainMat = new THREE.MeshStandardMaterial({ color: mainCol, roughness: 0.42 });\n        const accentMat = new THREE.MeshStandardMaterial({ color: accentCol, roughness: 0.38 });\n        const goldMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xd97706, emissiveIntensity: 0.22, roughness: 0.3 });\n        const hairMat = new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 0.78 });\n\n        function makeLeg(side) {\n          const hip = new THREE.Group(); hip.position.set(side * 0.16, 0.62, 0);\n          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.085, 0.52, 10), accentMat);\n          leg.position.y = -0.26; leg.castShadow = true; hip.add(leg);\n          const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, 0.28), goldMat);\n          shoe.position.set(0, -0.56, 0.05); hip.add(shoe);\n          return hip;\n        }\n        const leftLeg = makeLeg(-1), rightLeg = makeLeg(1);\n        bodyPivot.add(leftLeg, rightLeg);\n\n        // Festive Carnival Tunic + Flared Colorful Ruffle Skirt/Waistband\n        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.64, 16), mainMat);\n        torso.position.y = 0.94; torso.castShadow = true; bodyPivot.add(torso);\n\n        const ruffle = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.3, 18), accentMat);\n        ruffle.position.y = 0.68; bodyPivot.add(ruffle);\n\n        const goldBelt = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.045, 8, 20), goldMat);\n        goldBelt.rotation.x = Math.PI / 2; goldBelt.position.y = 0.8; bodyPivot.add(goldBelt);\n\n        // Shoulder Festive Epaulettes\n        [-0.3, 0.3].forEach(sx => {\n          const ep = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 10), goldMat);\n          ep.position.set(sx, 1.24, 0); bodyPivot.add(ep);\n        });\n\n        // GLORIOUS CARNIVAL FEATHER BACK-WING FAN (7 Vibrant Plumes!)\n        const wingFan = new THREE.Group();\n        wingFan.position.set(0, 1.18, -0.24);\n        for (let i = 0; i < 7; i++) {\n          const ang = -1.25 + (i / 6) * 2.5;\n          const fMat = new THREE.MeshStandardMaterial({\n            color: featherPalette[i % featherPalette.length],\n            emissive: featherPalette[i % featherPalette.length],\n            emissiveIntensity: 0.18,\n            roughness: 0.4\n          });\n          const plume = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.78, 8), fMat);\n          plume.position.set(Math.sin(ang) * 0.42, Math.cos(ang) * 0.42, 0);\n          plume.rotation.z = -ang;\n          wingFan.add(plume);\n        }\n        bodyPivot.add(wingFan);\n\n        function makeArm(side) {\n          const sh = new THREE.Group(); sh.position.set(side * 0.32, 1.18, 0);\n          const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.068, 0.46, 8), mainMat);\n          arm.position.y = -0.21; sh.add(arm);\n          // Carnival wristband pom-pom\n          const pom = new THREE.Mesh(new THREE.SphereGeometry(0.095, 8, 8), goldMat);\n          pom.position.y = -0.45; sh.add(pom);\n          return sh;\n        }\n        const leftArm = makeArm(-1), rightArm = makeArm(1);\n        bodyPivot.add(leftArm, rightArm);\n\n        // Head + Carnival Feathered Crown Headdress!\n        const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 16), skinMat);\n        head.position.y = 1.48; head.castShadow = true; bodyPivot.add(head);\n        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.275, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.56), hairMat);\n        hair.position.y = 1.51; hair.rotation.x = -0.18; bodyPivot.add(hair);\n\n        const crownBand = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.045, 8, 20), goldMat);\n        crownBand.rotation.x = Math.PI / 2; crownBand.position.y = 1.64; bodyPivot.add(crownBand);\n        [-0.35, 0, 0.35].forEach((ca, idx) => {\n          const hf = new THREE.Mesh(\n            new THREE.ConeGeometry(0.075, 0.38, 8),\n            new THREE.MeshStandardMaterial({ color: featherPalette[idx % featherPalette.length], roughness: 0.4 })\n          );\n          hf.position.set(Math.sin(ca) * 0.22, 1.85, 0.08);\n          hf.rotation.z = -ca;\n          bodyPivot.add(hf);\n        });\n\n        const nameTag = makeSpriteLabel(nameText, tagBg, 0.94);\n        nameTag.position.set(0, 2.48, 0);\n        bodyPivot.add(nameTag);\n\n        const tickBadge = makeResultBadgeSprite(true);\n        tickBadge.position.set(0, 3.38, 0); tickBadge.visible = false; bodyPivot.add(tickBadge);\n\n        const crossBadge = makeResultBadgeSprite(false);\n        crossBadge.position.set(0, 3.38, 0); crossBadge.visible = false; bodyPivot.add(crossBadge);\n\n        root.userData = { bodyPivot, leftLeg, rightLeg, leftArm, rightArm, tickBadge, crossBadge, nameTag };\n        return root;\n      }\n\n      const vectoChar = createCharacter('Vecto', '#1d4ed8', 0x2563eb, 0xec4899, [0xfacc15, 0xec4899, 0x38bdf8, 0xf97316]);\n      const player1Char = createCharacter('Người chơi 1', '#047857', 0x10b981, 0xfacc15, [0x34d399, 0xfacc15, 0x06b6d4, 0xf472b6]);\n      const player2Char = createCharacter('Người chơi 2', '#dc2626', 0xf97316, 0x7c3aed, [0xef4444, 0xfacc15, 0xa855f7, 0xec4899]);\n      scene.add(vectoChar, player1Char, player2Char);\n\n      // =========================================================================\n      // 9. OVERLAYS & ANIMATION ENGINE\n      // =========================================================================\n      const overlayGroup = new THREE.Group();\n      scene.add(overlayGroup);\n      let leaderArrow = null, p1Arrow = null, p1Arc = null, p2Arrow = null, paraObj = null, slidingArrow = null;\n\n      function buildArrow(fromOxy, toOxy, color, yH = 0.14) {\n        const s = oxyToWorld(fromOxy.x, fromOxy.y, yH), e = oxyToWorld(toOxy.x, toOxy.y, yH);\n        const dir = new THREE.Vector3().subVectors(e, s), len = dir.length();\n        const g = new THREE.Group();\n        if (len < 0.05) return g;\n        const hLen = Math.min(0.45, len * 0.35), sLen = Math.max(0.01, len - hLen);\n        const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.22 });\n        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.082, 0.082, sLen, 12), mat);\n        shaft.position.y = sLen / 2; g.add(shaft);\n        const head = new THREE.Mesh(new THREE.ConeGeometry(0.21, hLen, 14), mat);\n        head.position.y = sLen + hLen / 2; g.add(head);\n        g.position.copy(s);\n        g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());\n        return g;\n      }\n\n      function buildArc(fromOxy, toOxy, color) {\n        const s = oxyToWorld(fromOxy.x, fromOxy.y, 0.15), e = oxyToWorld(toOxy.x, toOxy.y, 0.15);\n        const mid = s.clone().lerp(e, 0.5);\n        mid.y = 1.2 + s.distanceTo(e) * 0.25;\n        const pts = new THREE.QuadraticBezierCurve3(s, mid, e).getPoints(24);\n        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ color, dashSize: 0.22, gapSize: 0.14 }));\n        line.computeLineDistances();\n        return line;\n      }\n\n      function buildDashed(p1, p2, color) {\n        const line = new THREE.Line(\n          new THREE.BufferGeometry().setFromPoints([oxyToWorld(p1.x, p1.y, 0.09), oxyToWorld(p2.x, p2.y, 0.09)]),\n          new THREE.LineDashedMaterial({ color, dashSize: 0.2, gapSize: 0.14 })\n        );\n        line.computeLineDistances();\n        return line;\n      }\n\n      function clearOverlays() {\n        while (overlayGroup.children.length) overlayGroup.remove(overlayGroup.children[0]);\n        leaderArrow = p1Arrow = p1Arc = p2Arrow = paraObj = slidingArrow = null;\n        [vectoChar, player1Char, player2Char].forEach(c => { c.userData.tickBadge.visible = false; c.userData.crossBadge.visible = false; });\n        tileMap.forEach(e => { e.pad.material.color.setHex(e.baseColor); e.pad.scale.set(1, 1, 1); });\n      }\n\n      function refreshVisibility() {\n        if (leaderArrow) leaderArrow.visible = state.showVectors;\n        if (p1Arrow) p1Arrow.visible = state.showVectors;\n        if (p2Arrow) p2Arrow.visible = state.showVectors;\n        if (paraObj) paraObj.visible = state.showParallelogram;\n      }\n\n      function highlightTile(oxy, hex) {\n        const e = tileMap.get(`${oxy.x},${oxy.y}`);\n        if (e) { e.pad.material.color.setHex(hex); e.pad.scale.set(1.3, 1.4, 1.3); }\n      }\n\n      const animQueue = [];\n      function animateJump(ch, fromOxy, toOxy, dur, onDone) {\n        const s = oxyToWorld(fromOxy.x, fromOxy.y, 0), e = oxyToWorld(toOxy.x, toOxy.y, 0);\n        const peak = 1.15 + s.distanceTo(e) * 0.25;\n        const yaw = Math.atan2(e.x - s.x, e.z - s.z);\n        SoundFX.playJump();\n        animQueue.push({ type: 'jump', t: 0, dur, ch, s, e, peak, yaw, onDone });\n      }\n\n      function animateSlide(fromS, fromE, toS, dur, onDone) {\n        slidingArrow = buildArrow(fromS, fromE, 0xf59e0b, 0.24);\n        overlayGroup.add(slidingArrow);\n        animQueue.push({ type: 'slide', t: 0, dur, obj: slidingArrow, pS: oxyToWorld(fromS.x, fromS.y, 0.24), pE: oxyToWorld(toS.x, toS.y, 0.24), onDone });\n      }\n\n      function updateUI() {\n        const v = getVector();\n        document.getElementById('pill-vec').textContent = `v:(${v.x};${v.y})`;\n        const tc = document.getElementById('timer-chip');\n        if (state.mode === 'play') { tc.classList.remove('hidden'); tc.classList.add('flex'); }\n        else { tc.classList.add('hidden'); tc.classList.remove('flex'); }\n        document.getElementById('timer-display').textContent = `${Math.max(0, state.timeLeft).toFixed(1)}s`;\n        document.getElementById('timer-bar').style.width = `${Math.max(0, Math.min(100, (state.timeLeft / 15) * 100))}%`;\n        const tDot = document.getElementById('timer-dot');\n        if (state.phase === 'awaiting_tap') tDot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-ping';\n        else if (state.phase === 'timeout') tDot.className = 'w-2 h-2 rounded-full bg-rose-500';\n        else tDot.className = 'w-2 h-2 rounded-full bg-amber-400';\n        const mid = document.getElementById('pill-mid');\n        const right = document.getElementById('pill-right');\n\n        document.getElementById('btn-rules').classList.toggle('active', state.mode === 'rules');\n        document.getElementById('btn-play').classList.toggle('active', state.mode === 'play');\n        document.getElementById('lbl-play').textContent = (state.mode === 'play' && (state.phase === 'resolved' || state.phase === 'timeout')) ? 'Tiếp tục →' : 'Bắt đầu';\n\n        if (state.mode === 'rules') {\n          if (state.p1Status === 'correct') {\n            mid.className = 'px-2 py-1 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-200 truncate flex-1 text-center';\n            mid.textContent = 'NC1: ✓ Đúng';\n          } else {\n            mid.className = 'px-2 py-1 rounded-lg bg-slate-100 text-slate-600 truncate flex-1 text-center';\n            mid.textContent = 'NC1: Chờ...';\n          }\n          if (state.p2Done) {\n            right.className = 'px-2 py-1 rounded-lg bg-rose-100 text-rose-700 border border-rose-200 truncate';\n            right.textContent = 'NC2: ✗ Sai';\n          } else {\n            right.className = 'px-2 py-1 rounded-lg bg-slate-100 text-slate-600 truncate';\n            right.textContent = 'NC2: Chờ...';\n          }\n        } else {\n          // Interactive Play Mode (\"Bắt đầu\")\n          right.className = 'px-2 py-1 rounded-lg bg-amber-100 text-amber-900 border border-amber-200 truncate';\n          right.textContent = `${state.score}đ • ${state.streak}🔥`;\n\n          if (state.phase === 'awaiting_tap') {\n            mid.className = 'px-2 py-1 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 truncate flex-1 text-center';\n            mid.textContent = `Chạm ô ảnh của M(${state.M.x};${state.M.y})`;\n          } else if (state.p1Status === 'correct') {\n            mid.className = 'px-2 py-1 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-300 truncate flex-1 text-center';\n            mid.textContent = '✓ Chính xác! Bấm Tiếp →';\n          } else if (state.phase === 'timeout') {\n            const mp = getTargetMPrime();\n            mid.className = 'px-2 py-1 rounded-lg bg-rose-100 text-rose-700 border border-rose-300 truncate flex-1 text-center';\n            mid.textContent = `⏰ Hết giờ! Đáp án (${mp.x};${mp.y})`;\n          } else if (state.p1Status === 'wrong') {\n            mid.className = 'px-2 py-1 rounded-lg bg-rose-100 text-rose-700 border border-rose-300 truncate flex-1 text-center';\n            mid.textContent = '✗ Chưa đúng, chạm lại!';\n          } else {\n            mid.className = 'px-2 py-1 rounded-lg bg-blue-50 text-blue-800 truncate flex-1 text-center';\n            mid.textContent = 'Vecto đang nhảy...';\n          }\n        }\n      }\n\n      function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }\n\n      function pickNewCoordinates() {\n        for (let tries = 0; tries < 200; tries++) {\n          const vx = randInt(-3, 3), vy = randInt(-3, 3);\n          if ((vx === 0 && vy === 0) || Math.abs(vx) + Math.abs(vy) < 2) continue;\n          const ax = randInt(Math.max(GRID_MIN, GRID_MIN - vx), Math.min(GRID_MAX, GRID_MAX - vx));\n          const ay = randInt(Math.max(GRID_MIN, GRID_MIN - vy), Math.min(GRID_MAX, GRID_MAX - vy));\n          const bx = ax + vx, by = ay + vy;\n          const mx = randInt(Math.max(GRID_MIN, GRID_MIN - vx), Math.min(GRID_MAX, GRID_MAX - vx));\n          const my = randInt(Math.max(GRID_MIN, GRID_MIN - vy), Math.min(GRID_MAX, GRID_MAX - vy));\n          const mpx = mx + vx, mpy = my + vy;\n          const m2x = randInt(-3, 3), m2y = randInt(-3, 3);\n          const used = new Set([`${ax},${ay}`, `${bx},${by}`, `${mx},${my}`, `${mpx},${mpy}`, `${m2x},${m2y}`]);\n          if (used.size < 5) continue;\n\n          const wCands = [[vx, -vy], [-vx, vy], [vy, vx], [vx + 1, vy - 1], [vx - 1, vy + 1]];\n          let p2w = null;\n          for (const [wx, wy] of wCands) {\n            if (wx === vx && wy === vy) continue;\n            const px = m2x + wx, py = m2y + wy;\n            if (px >= GRID_MIN && px <= GRID_MAX && py >= GRID_MIN && py <= GRID_MAX && !used.has(`${px},${py}`)) {\n              p2w = { x: px, y: py }; break;\n            }\n          }\n          if (!p2w) continue;\n\n          state.A = { x: ax, y: ay }; state.B = { x: bx, y: by };\n          state.M = { x: mx, y: my }; state.M2 = { x: m2x, y: m2y };\n          state.P2Wrong = p2w;\n          return;\n        }\n      }\n\n      // MODE 1: \"Luật chơi\" (3-character visual rule demo: Vecto -> NC1 ✓ -> NC2 ✗)\n      function startRulesDemo() {\n        SoundFX.stopFestivalMusic();\n        state.mode = 'rules';\n        state.phase = 'demo';\n        animQueue.length = 0;\n        clearOverlays();\n        pickNewCoordinates();\n        state.p1Status = 'waiting';\n        state.p2Done = false;\n\n        player2Char.visible = true;\n        vectoChar.position.copy(oxyToWorld(state.A.x, state.A.y, 0));\n        player1Char.position.copy(oxyToWorld(state.M.x, state.M.y, 0));\n        player2Char.position.copy(oxyToWorld(state.M2.x, state.M2.y, 0));\n        vectoChar.rotation.y = player1Char.rotation.y = player2Char.rotation.y = 0;\n\n        highlightTile(state.A, 0x3b82f6);\n        highlightTile(state.M, 0x10b981);\n        highlightTile(state.M2, 0xf97316);\n        updateChalkboard();\n        updateUI();\n\n        animateJump(vectoChar, state.A, state.B, 0.95, () => {\n          highlightTile(state.B, 0x1d4ed8);\n          leaderArrow = buildArrow(state.A, state.B, 0xf59e0b);\n          overlayGroup.add(leaderArrow, buildArc(state.A, state.B, 0x3b82f6));\n          refreshVisibility();\n\n          animateSlide(state.A, state.B, state.M, 0.78, () => {\n            if (slidingArrow) { overlayGroup.remove(slidingArrow); slidingArrow = null; }\n            const mp = getTargetMPrime();\n            animateJump(player1Char, state.M, mp, 0.95, () => {\n              state.p1Status = 'correct';\n              player1Char.userData.tickBadge.visible = true;\n              highlightTile(mp, 0x10b981);\n              p1Arrow = buildArrow(state.M, mp, 0x10b981);\n              p1Arc = buildArc(state.M, mp, 0x10b981);\n              paraObj = new THREE.Group();\n              paraObj.add(buildDashed(state.A, state.M, 0x6366f1), buildDashed(state.B, mp, 0x6366f1));\n              overlayGroup.add(p1Arrow, p1Arc, paraObj);\n              refreshVisibility();\n              SoundFX.playCorrect();\n              if (typeof confetti === 'function') confetti({ particleCount: 38, spread: 58, origin: { y: 0.6 } });\n              updateChalkboard();\n              updateUI();\n\n              animQueue.push({\n                type: 'delay', t: 0, dur: 0.7, onDone: () => {\n                  animateJump(player2Char, state.M2, state.P2Wrong, 0.95, () => {\n                    state.p2Done = true;\n                    player2Char.userData.crossBadge.visible = true;\n                    highlightTile(state.P2Wrong, 0xef4444);\n                    p2Arrow = buildArrow(state.M2, state.P2Wrong, 0xef4444);\n                    overlayGroup.add(p2Arrow, buildArc(state.M2, state.P2Wrong, 0xef4444));\n                    refreshVisibility();\n                    SoundFX.playWrong();\n                    updateChalkboard();\n                    updateUI();\n                  });\n                }\n              });\n            });\n          });\n        });\n      }\n\n      // MODE 2: \"Bắt đầu\" (Interactive playable game — tap floor pad to jump!)\n      function startPlayGame() {\n        SoundFX.stopFestivalMusic();\n        state.timeLeft = 15.0;\n        state.mode = 'play';\n        state.phase = 'leader_jumping';\n        animQueue.length = 0;\n        clearOverlays();\n        pickNewCoordinates();\n        state.p1Status = 'waiting';\n        state.p2Done = false;\n\n        player2Char.visible = false;\n        vectoChar.position.copy(oxyToWorld(state.A.x, state.A.y, 0));\n        player1Char.position.copy(oxyToWorld(state.M.x, state.M.y, 0));\n        vectoChar.rotation.y = player1Char.rotation.y = 0;\n\n        highlightTile(state.A, 0x3b82f6);\n        highlightTile(state.M, 0x10b981);\n        updateChalkboard();\n        updateUI();\n\n        animateJump(vectoChar, state.A, state.B, 0.95, () => {\n          highlightTile(state.B, 0x1d4ed8);\n          leaderArrow = buildArrow(state.A, state.B, 0xf59e0b);\n          overlayGroup.add(leaderArrow, buildArc(state.A, state.B, 0x3b82f6));\n          refreshVisibility();\n          state.phase = 'awaiting_tap';\n          state.timeLeft = 15.0;\n          SoundFX.startStreetFestivalMusic15s();\n          updateUI();\n        });\n      }\n\n      function executePlayerTapJump(dest) {\n        if (state.mode !== 'play' || state.phase !== 'awaiting_tap') return;\n        state.phase = 'player_jumping';\n        player1Char.userData.tickBadge.visible = false;\n        player1Char.userData.crossBadge.visible = false;\n        if (p1Arrow) { overlayGroup.remove(p1Arrow); p1Arrow = null; }\n        if (p1Arc) { overlayGroup.remove(p1Arc); p1Arc = null; }\n\n        // Always jump from M so retries feel clean\n        player1Char.position.copy(oxyToWorld(state.M.x, state.M.y, 0));\n\n        animateJump(player1Char, state.M, dest, 0.85, () => {\n          const mp = getTargetMPrime();\n          const ok = (dest.x === mp.x && dest.y === mp.y);\n          if (ok) {\n            SoundFX.stopFestivalMusic();\n            state.phase = 'resolved';\n            state.p1Status = 'correct';\n            state.streak++;\n            state.score += 10 + Math.min(state.streak * 2, 10);\n            player1Char.userData.tickBadge.visible = true;\n            highlightTile(mp, 0x10b981);\n            p1Arrow = buildArrow(state.M, mp, 0x10b981);\n            p1Arc = buildArc(state.M, mp, 0x10b981);\n            paraObj = new THREE.Group();\n            paraObj.add(buildDashed(state.A, state.M, 0x6366f1), buildDashed(state.B, mp, 0x6366f1));\n            overlayGroup.add(p1Arrow, p1Arc, paraObj);\n            refreshVisibility();\n            SoundFX.playCorrect();\n            if (typeof confetti === 'function') confetti({ particleCount: 50, spread: 65, origin: { y: 0.6 } });\n          } else {\n            state.phase = 'awaiting_tap';\n            state.p1Status = 'wrong';\n            state.streak = 0;\n            player1Char.userData.crossBadge.visible = true;\n            highlightTile(dest, 0xef4444);\n            p1Arrow = buildArrow(state.M, dest, 0xef4444);\n            p1Arc = buildArc(state.M, dest, 0xef4444);\n            overlayGroup.add(p1Arrow, p1Arc);\n            refreshVisibility();\n            SoundFX.playWrong();\n          }\n          updateChalkboard();\n          updateUI();\n        });\n      }\n\n      // =========================================================================\n      // 10. TOUCH ORBIT + TAP-TO-JUMP RAYCASTER\n      // =========================================================================\n      const raycaster = new THREE.Raycaster();\n      const pointerNDC = new THREE.Vector2();\n      const domEl = renderer.domElement;\n\n      function getTappedTile(clientX, clientY) {\n        const rect = domEl.getBoundingClientRect();\n        pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;\n        pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;\n        raycaster.setFromCamera(pointerNDC, camera);\n        const hits = raycaster.intersectObjects(tileHitMeshes, false);\n        if (hits.length > 0) return { x: hits[0].object.userData.gx, y: hits[0].object.userData.gy };\n        return null;\n      }\n\n      domEl.addEventListener('pointerdown', (e) => {\n        SoundFX.ensureCtx();\n        orbit.isDragging = true;\n        orbit.lastPos = { x: e.clientX, y: e.clientY };\n        orbit.movedDist = 0;\n      });\n      window.addEventListener('pointermove', (e) => {\n        if (!orbit.isDragging) return;\n        const dx = e.clientX - orbit.lastPos.x, dy = e.clientY - orbit.lastPos.y;\n        orbit.movedDist += Math.hypot(dx, dy);\n        orbit.lastPos = { x: e.clientX, y: e.clientY };\n        orbit.desiredTheta -= dx * 0.007;\n        orbit.desiredPhi = THREE.MathUtils.clamp(orbit.desiredPhi - dy * 0.007, 0.08, 1.38);\n      });\n      window.addEventListener('pointerup', (e) => {\n        if (!orbit.isDragging) return;\n        orbit.isDragging = false;\n        if (orbit.movedDist < 10 && state.mode === 'play' && state.phase === 'awaiting_tap') {\n          const tile = getTappedTile(e.clientX, e.clientY);\n          if (tile) {\n            SoundFX.playTick();\n            executePlayerTapJump(tile);\n          }\n        }\n      });\n\n      domEl.addEventListener('wheel', (e) => {\n        e.preventDefault();\n        orbit.desiredRadius = THREE.MathUtils.clamp(orbit.desiredRadius + e.deltaY * 0.012, 9, 28);\n      }, { passive: false });\n\n      domEl.addEventListener('touchstart', (e) => {\n        if (e.touches.length === 2) {\n          orbit.isDragging = false;\n          orbit.pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);\n        }\n      }, { passive: true });\n      domEl.addEventListener('touchmove', (e) => {\n        if (e.touches.length === 2) {\n          const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);\n          orbit.desiredRadius = THREE.MathUtils.clamp(orbit.desiredRadius + (orbit.pinchDist - d) * 0.05, 9, 28);\n          orbit.pinchDist = d;\n        }\n      }, { passive: true });\n\n      document.getElementById('btn-rules').addEventListener('click', () => startRulesDemo());\n      const nameModal = document.getElementById('name-modal');\n      const nameInput = document.getElementById('input-player-name');\n\n      function applyPlayerName(rawName) {\n        const clean = (rawName || '').trim().slice(0, 16) || 'Người chơi 1';\n        state.playerName = clean;\n        state.hasEnteredName = true;\n        document.getElementById('lbl-player-badge').textContent = clean;\n\n        // Live-update the 3D floating name tag above Player 1's head!\n        if (player1Char && player1Char.userData.nameTag) {\n          const oldTag = player1Char.userData.nameTag;\n          player1Char.userData.bodyPivot.remove(oldTag);\n          const newTag = makeSpriteLabel(clean, '#047857', 0.94);\n          newTag.position.set(0, 2.32, 0);\n          player1Char.userData.bodyPivot.add(newTag);\n          player1Char.userData.nameTag = newTag;\n        }\n        updateChalkboard();\n        updateUI();\n      }\n\n      function openNameModal(startAfterSave) {\n        nameInput.value = state.hasEnteredName ? state.playerName : '';\n        nameModal.dataset.startAfter = startAfterSave ? '1' : '0';\n        nameModal.classList.remove('hidden');\n        nameModal.classList.add('flex');\n        setTimeout(() => nameInput.focus(), 80);\n      }\n\n      function closeNameModal() {\n        nameModal.classList.add('hidden');\n        nameModal.classList.remove('flex');\n      }\n\n      function submitPlayerName() {\n        const prevName = state.playerName;\n        applyPlayerName(nameInput.value);\n        // Reset score if a new student enters a different name\n        if (state.playerName !== prevName) {\n          state.score = 0;\n          state.streak = 0;\n        }\n        const shouldStart = nameModal.dataset.startAfter === '1';\n        closeNameModal();\n        if (shouldStart) startPlayGame();\n      }\n\n      document.getElementById('btn-edit-name').addEventListener('click', () => openNameModal(false));\n      document.getElementById('btn-close-name').addEventListener('click', closeNameModal);\n      document.getElementById('btn-save-name').addEventListener('click', submitPlayerName);\n      nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitPlayerName(); });\n      nameModal.addEventListener('click', (e) => { if (e.target === nameModal) closeNameModal(); });\n\n      document.getElementById('btn-play').addEventListener('click', () => {\n        if (!state.hasEnteredName) {\n          openNameModal(true);\n        } else {\n          startPlayGame();\n        }\n      });\n      document.getElementById('cam-room').addEventListener('click', () => applyCameraPreset('room'));\n      document.getElementById('cam-top').addEventListener('click', () => applyCameraPreset('top'));\n\n      document.getElementById('btn-sound').addEventListener('click', () => {\n        SoundFX.enabled = !SoundFX.enabled;\n        if (!SoundFX.enabled) SoundFX.stopFestivalMusic();\n        document.getElementById('icon-sound').setAttribute('data-lucide', SoundFX.enabled ? 'volume-2' : 'volume-x');\n        if (window.lucide) lucide.createIcons();\n      });\n\n      document.getElementById('btn-toggle-vec').addEventListener('click', (e) => {\n        state.showVectors = !state.showVectors;\n        e.currentTarget.classList.toggle('active', state.showVectors);\n        refreshVisibility();\n      });\n      document.getElementById('btn-toggle-para').addEventListener('click', (e) => {\n        state.showParallelogram = !state.showParallelogram;\n        e.currentTarget.classList.toggle('active', state.showParallelogram);\n        refreshVisibility();\n      });\n\n      window.addEventListener('resize', () => {\n        camera.aspect = window.innerWidth / window.innerHeight;\n        camera.updateProjectionMatrix();\n        renderer.setSize(window.innerWidth, window.innerHeight);\n      });\n\n      // =========================================================================\n      // 11. MAIN LOOP\n      // =========================================================================\n      const clock = new THREE.Clock();\n      let rafId = null;\n\n      function animate() {\n        rafId = requestAnimationFrame(animate);\n        const dt = Math.min(0.05, clock.getDelta());\n        const elapsed = clock.elapsedTime;\n\n        if (state.mode === 'play' && state.phase === 'awaiting_tap') {\n          state.timeLeft -= dt;\n          if (state.timeLeft <= 0) {\n            state.timeLeft = 0;\n            state.phase = 'timeout';\n            state.streak = 0;\n            SoundFX.playTimeUp();\n            const mp = getTargetMPrime();\n            highlightTile(mp, 0x10b981);\n            p1Arrow = buildArrow(state.M, mp, 0x10b981);\n            overlayGroup.add(p1Arrow);\n            refreshVisibility();\n            updateChalkboard();\n            updateUI();\n          } else {\n            document.getElementById('timer-display').textContent = `${state.timeLeft.toFixed(1)}s`;\n            document.getElementById('timer-bar').style.width = `${(state.timeLeft / 15) * 100}%`;\n          }\n        }\n\n        for (let i = animQueue.length - 1; i >= 0; i--) {\n          const a = animQueue[i];\n          a.t += dt;\n          const p = Math.min(1, a.t / a.dur);\n          if (a.type === 'delay') {\n            if (p >= 1) { animQueue.splice(i, 1); if (a.onDone) a.onDone(); }\n          } else if (a.type === 'jump') {\n            const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;\n            a.ch.rotation.y = a.yaw;\n            a.ch.position.set(THREE.MathUtils.lerp(a.s.x, a.e.x, ease), 0, THREE.MathUtils.lerp(a.s.z, a.e.z, ease));\n            a.ch.userData.bodyPivot.position.y = 4 * a.peak * p * (1 - p);\n            a.ch.userData.leftArm.rotation.x = -2.0 * Math.sin(p * Math.PI);\n            a.ch.userData.rightArm.rotation.x = -2.0 * Math.sin(p * Math.PI);\n            if (p >= 1) {\n              a.ch.position.copy(a.e);\n              a.ch.userData.bodyPivot.position.y = 0;\n              a.ch.userData.leftArm.rotation.x = a.ch.userData.rightArm.rotation.x = 0;\n              SoundFX.playLand();\n              animQueue.splice(i, 1);\n              if (a.onDone) a.onDone();\n            }\n          } else if (a.type === 'slide') {\n            const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;\n            a.obj.position.lerpVectors(a.pS, a.pE, ease);\n            a.obj.position.y = 0.24 + Math.sin(p * Math.PI) * 0.55;\n            if (p >= 1) { animQueue.splice(i, 1); if (a.onDone) a.onDone(); }\n          }\n        }\n\n        [player1Char, player2Char].forEach(c => {\n          if (c.userData.tickBadge.visible) c.userData.tickBadge.position.y = 3.24 + Math.sin(elapsed * 5.2) * 0.08;\n          if (c.userData.crossBadge.visible) c.userData.crossBadge.position.y = 3.24 + Math.sin(elapsed * 6.2) * 0.08;\n        });\n\n        swanBoats.forEach(sb => {\n          sb.group.position.y = -0.22 + Math.sin(elapsed * 2.1 + sb.phase) * 0.06;\n          sb.group.position.x = sb.baseX + Math.sin(elapsed * 0.4 + sb.phase) * 0.8;\n        });\n        cheeringDancers.forEach(cd => {\n          const b = Math.abs(Math.sin(elapsed * 5.2 + cd.phase));\n          cd.pivot.position.y = b * 0.16;\n          cd.armL.rotation.z = 0.45 + Math.sin(elapsed * 7.5 + cd.phase) * 0.35;\n          cd.armR.rotation.z = -0.45 - Math.sin(elapsed * 7.5 + cd.phase) * 0.35;\n        });\n\n        updateCamera(dt);\n        renderer.render(scene, camera);\n      }\n\n      window.onload = function () {\n        if (window.lucide) lucide.createIcons();\n        applyCameraPreset('room');\n        orbit.theta = orbit.desiredTheta;\n        orbit.phi = orbit.desiredPhi;\n        orbit.radius = orbit.desiredRadius;\n        orbit.target.copy(orbit.desiredTarget);\n        updateCamera(1);\n\n        if (rafId) cancelAnimationFrame(rafId);\n        animate();\n        startRulesDemo();\n      };\n    })();\n  <\/script>\n</body>\n</html>\n", "doixungtruc": "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\" />\n  <title>Phép Đối Xứng Trục 3D (Mobile) — Festival Hoa Đà Lạt lần thứ 11</title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n  <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap\" rel=\"stylesheet\" />\n  <script src=\"https://cdn.tailwindcss.com/3.4.17\"><\/script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n  <script src=\"https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js\"><\/script>\n  <script src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js\"><\/s forEach(n => { try { n.stop(); } catch (e) {} });\n          this.activeNodes = [];\n        },\n        playTone(freq, startOffset, dur, type = 'triangle', vol = 0.08) {\n          const ctx = this.ensureCtx();\n          if (!ctx) return;\n          const now = ctx.currentTime + startOffset;\n          const osc = ctx.createOscillator(), gain = ctx.createGain();\n          osc.type = type;\n          osc.frequency.setValueAtTime(freq, now);\n          gain.gain.setValueAtTime(0.001, now);\n          gain.gain.linearRampToValueAtTime(vol, now + 0.03);\n          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);\n          osc.connect(gain); gain.connect(ctx.destination);\n          osc.start(now); osc.stop(now + dur + 0.02);\n          this.activeNodes.push(osc);\n        },\n        startDalatMusic10s() {\n          this.stopMusic();\n          const ctx = this.ensureCtx();\n          if (!ctx) return;\n          const beat = 0.33;\n          const melody = [\n            [329.63, 0, 2], [392.00, 2, 1], [493.88, 3, 2], [440.00, 5, 1],\n            [523.25, 6, 2], [493.88, 8, 1], [392.00, 9, 3],\n            [440.00, 12, 2], [493.88, 14, 1], [587.33, 15, 2], [523.25, 17, 1],\n            [493.88, 18, 2], [392.00, 20, 1], [440.00, 21, 3],\n            [392.00, 24, 1], [493.88, 25, 1], [587.33, 26, 1], [659.25, 27, 2.5]\n          ];\n          const chords = [\n            [164.81, 246.94, 329.63], [164.81, 246.94, 329.63],\n            [130.81, 261.63, 329.63], [196.00, 246.94, 293.66],\n            [220.00, 261.63, 329.63], [146.83, 220.00, 293.66],\n            [196.00, 246.94, 293.66], [146.83, 220.00, 293.66],\n            [196.00, 246.94, 293.66], [196.00, 246.94, 392.00]\n          ];\n          melody.forEach(([f, b, l]) => {\n            this.playTone(f, b * beat, l * beat * 0.96, 'sine', 0.11);\n            this.playTone(f * 2, b * beat, l * beat * 0.82, 'sine', 0.02);\n          });\n          chords.forEach((ch, bar) => {\n            const t0 =      function applyCameraPreset(preset) {\n        const isPortrait = window.innerHeight > window.innerWidth;\n        if (preset === 'stage') {\n          orbit.desiredTheta = 0.0;\n          orbit.desiredPhi = isPortrait ? 1.06 : 1.08;\n          orbit.desiredRadius = isPortrait ? 19.6 : 14.0;\n          orbit.desiredTarget.set(0, isPortrait ? 0.65 : 1.35, -0.7);\n        } else if (preset === 'top') {\n          orbit.desiredTheta = 0.0;\n          orbit.desiredPhi = 0.14;\n          orbit.desiredRadius = isPortrait ? 21.5 : 14.5;\n          orbit.desiredTarget.set(0, 0, isPortrait ? 0.5 : -0.1);\n        }\n        document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));\n        const btn = document.getElementById('cam-' + preset);\n        if (btn) btn.classList.add('active');\n      }\n\n      function updateCamera(dt) {\n        const k = Math.min(1, dt * 7.5);\n        orbit.theta += (orbit.desiredTheta - orbit.theta) * k;\n        orbit.phi += (orbit.desiredPhi - orbit.phi) * k;\n        orbit.radius += (orbit.desiredRadius - orbit.radius) * k;\n        orbit.target.lerp(orbit.desiredTarget, k);\n        const sinPhi = Math.sin(orbit.phi);\n        camera.position.set(\n          orbit.target.x + orbit.radius * sinPhi * Math.sin(orbit.theta),\n          Math.max(1.0, orbit.target.y + orbit.radius * Math.cos(orbit.phi)),\n          orbit.target.z + orbit.radius * sinPhi * Math.cos(orbit.theta)\n        );\n        camera.lookAt(orbit.target);\n      }\n\n      // =========================================================================\n      // 5. CLASSROOM STAGE (CLEAN GREEN BOARD WITH TITLE + VERTICAL AXIS ONLY)\n      // =========================================================================\n      function createWoodFloorTexture() {\n        const c = document.createElement('canvas');\n        c.width = 512; c.height = 512;\n        const ctx = c.getContext('2d');\n        ctx.fillStyle = '#c8925a';\n        ctx.fillRect(0, 0     const g = new THREE.Group();\n        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.42 });\n        const darkMat = new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.55 });\n        const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.11, 16), bodyMat);\n        b1.rotation.x = Math.PI / 2; b1.position.set(-0.14, 0, 0); g.add(b1);\n        const b2 = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.11, 16), bodyMat);\n        b2.rotation.x = Math.PI / 2; b2.position.set(0.12, 0.04, 0); g.add(b2);\n        const hole = new THREE.Mesh(new THREE.CircleGeometry(0.075, 14), new THREE.MeshBasicMaterial({ color: 0x1c1917 }));\n        hole.position.set(0.01, 0.02, 0.058); g.add(hole);\n        const neck = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.065, 0.04), darkMat);\n        neck.position.set(0.52, 0.08, 0.01); neck.rotation.z = 0.12; g.add(neck);\n        return g;\n      }\n\n      function createGuitarGirl(nameText, tagBg, dressCol, mirrorSign, draggableId) {\n        const root = new THREE.Group(), animGroup = new THREE.Group();\n        root.add(animGroup);\n        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd5b8, roughness: 0.6 });\n        const dressMat = new THREE.MeshStandardMaterial({ color: dressCol, roughness: 0.5 });\n        const hairMat = new THREE.MeshStandardMaterial({ color: 0x1e1b18, roughness: 0.75 });\n        const stoolMat = new THREE.MeshStandardMaterial({ color: 0x92400e, roughness: 0.65 });\n\n        const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.32, 0.08, 16), stoolMat);\n        seat.position.y = 0.54; animGroup.add(seat);\n        for (let i = 0; i < 4; i++) {\n          const ang = (i / 4) * Math.PI * 2 + 0.4;\n          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.03, 0.54, 8), stoolMat);\n          leg.position.set(Math.cos(ang) * 0.21, 0.27, Math.sin(ang) * 0.21); animGroup.add(leg);\n        }\n        const sk
